<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>ポケモンチャンピオンズ 選出アシスタント</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  padding:0;
  background:#0f172a;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
body{
  min-height:100vh;
  padding-bottom:40px;
}
.container{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:16px 14px 40px;
}
h1{
  font-size:22px;
  margin:8px 0 6px;
  text-align:center;
}
.subtitle{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  margin-bottom:18px;
}
.section{
  background:#1e293b;
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
}
.section-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
}
.count{
  color:#38bdf8;
  font-size:14px;
  margin-left:6px;
}
.search{
  width:100%;
  height:48px;
  border:1px solid #475569;
  border-radius:12px;
  background:#0f172a;
  color:#fff;
  padding:0 14px;
  font-size:16px;
  outline:none;
  -webkit-appearance:none;
}
.search:focus{
  border-color:#38bdf8;
}
.search::placeholder{
  color:#64748b;
}
.suggestions{
  margin-top:8px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.suggestion{
  width:100%;
  min-height:46px;
  border:1px solid #334155;
  border-radius:11px;
  background:#273449;
  color:#fff;
  font-size:16px;
  text-align:left;
  padding:8px 12px;
  cursor:pointer;
  touch-action:manipulation;
}
.suggestion:active{
  background:#0ea5e9;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}
.card{
  position:relative;
  background:#0f172a;
  border:2px solid #334155;
  border-radius:12px;
  min-height:110px;
  padding:6px 4px;
  text-align:center;
  cursor:pointer;
  touch-action:manipulation;
  user-select:none;
}
.card:active{
  transform:scale(.97);
}
.card.selected{
  border-color:#38bdf8;
  background:#082f49;
  box-shadow:0 0 0 2px rgba(56,189,248,.18);
}
.card.disabled{
  opacity:.35;
}
.card img{
  width:70px;
  height:70px;
  object-fit:contain;
  display:block;
  margin:0 auto;
  image-rendering:auto;
}
.card-name{
  font-size:11px;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.number{
  position:absolute;
  top:4px;
  right:5px;
  background:#334155;
  color:#cbd5e1;
  border-radius:8px;
  padding:2px 5px;
  font-size:10px;
}
.selected .number{
  background:#0284c7;
  color:#fff;
}
.selected-area{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
  margin-top:10px;
}
.slot{
  min-height:72px;
  border:1px dashed #475569;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:10px;
  color:#64748b;
  overflow:hidden;
}
.slot img{
  width:50px;
  height:50px;
  object-fit:contain;
}
.slot-name{
  color:#fff;
  font-size:9px;
  white-space:nowrap;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
}
.buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}
button.action{
  flex:1;
  min-height:48px;
  border:0;
  border-radius:12px;
  font-size:15px;
  font-weight:700;
  color:#fff;
  background:#2563eb;
  touch-action:manipulation;
}
button.action.secondary{
  background:#475569;
}
button.action.danger{
  background:#b91c1c;
}
.result{
  background:#020617;
  border:1px solid #334155;
  border-radius:14px;
  padding:14px;
  margin-top:12px;
}
.result h3{
  margin:0 0 8px;
  font-size:17px;
}
.result-item{
  padding:9px 0;
  border-bottom:1px solid #1e293b;
}
.result-item:last-child{
  border-bottom:0;
}
.good{
  color:#4ade80;
}
.bad{
  color:#f87171;
}
.neutral{
  color:#facc15;
}
.note{
  color:#94a3b8;
  font-size:12px;
  line-height:1.5;
  margin-top:8px;
}
.hidden{
  display:none!important;
}
@media(max-width:420px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
  .card img{
    width:64px;
    height:64px;
  }
  .selected-area{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>
<body>
<div class="container">
<h1>⚔️ ポケモンチャンピオンズ</h1>
<div class="subtitle">選出アシスタント　6体 → 3体</div>
<!-- 相手 -->
<div class="section">
  <div class="section-title">
    相手の6体
    <span class="count" id="oppCount">0 / 6</span>
  </div>
  <input
    id="oppSearch"
    class="search"
    type="search"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="none"
    spellcheck="false"
    placeholder="ポケモン名を入力（例：マス、イダ、カイ）"
  >
  <div id="oppSuggestions" class="suggestions"></div>
  <div class="grid" id="oppGrid"></div>
  <div class="selected-area" id="oppSelected"></div>
  <div class="buttons">
    <button class="action secondary" id="oppClear">相手をリセット</button>
  </div>
</div>
<!-- 自分 -->
<div class="section">
  <div class="section-title">
    自分の6体
    <span class="count" id="myCount">0 / 6</span>
  </div>
  <input
    id="mySearch"
    class="search"
    type="search"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="none"
    spellcheck="false"
    placeholder="自分のポケモンを検索"
  >
  <div id="mySuggestions" class="suggestions"></div>
  <div class="grid" id="myGrid"></div>
  <div class="selected-area" id="mySelected"></div>
  <div class="buttons">
    <button class="action secondary" id="myClear">自分をリセット</button>
  </div>
</div>
<!-- 判定 -->
<div class="section">
  <div class="buttons">
    <button class="action" id="judge">⚔️ 3体を選出する</button>
  </div>
  <div id="result" class="result hidden"></div>
</div>
</div>

/* =========================
   使用率・検索優先順位
========================= */
const priority = [
"カイリュー",
"ガブリアス",
"サーフゴー",
"ミミッキュ",
"マスカーニャ",
"ブリジュラス",
"アシレーヌ",
"リザードン",
"ラグラージ",
"オーロンゲ",
"ギルガルド",
"ペリッパー",
"イダイトウ",
"バシャーモ",
"キラフロル",
"ゲンガー",
"カバルドン",
"ドドゲザン",
"ペンドラー",
"エルフーン"
];
function normalize(s){
  return (s || "")
    .toLowerCase()
    .replace(/[ 　]/g,"")
    .replace(/ー/g,"");
}
function scorePokemon(p,q){
  const n=normalize(q);
  if(!n) return 999;
  const name=normalize(p.name);
  if(name===n) return 0;
  if(name.startsWith(n)) return 1;
  if(name.includes(n)) return 2;
  if((p.aliases||[]).some(a=>normalize(a)===n)) return 0;
  if((p.aliases||[]).some(a=>normalize(a).startsWith(n))) return 1;
  if((p.aliases||[]).some(a=>normalize(a).includes(n))) return 2;
  return 999;
}
function searchPokemon(q){
  if(!q.trim()){
    return P.slice().sort((a,b)=>{
      const ai=priority.indexOf(a.name);
      const bi=priority.indexOf(b.name);
      if(ai<0 && bi<0) return 0;
      if(ai<0) return 1;
      if(bi<0) return -1;
      return ai-bi;
    });
  }
  return P
    .map(p=>({p,s:scorePokemon(p,q)}))
    .filter(x=>x.s<999)
    .sort((a,b)=>{
      if(a.s!==b.s) return a.s-b.s;
      const ai=priority.indexOf(a.p.name);
      const bi=priority.indexOf(b.p.name);
      if(ai<0 && bi<0) return 0;
      if(ai<0) return 1;
      if(bi<0) return -1;
      return ai-bi;
    })
    .map(x=>x.p);
}
/* =========================
   画像
========================= */
function image(id){
  return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/"+id+".png";
}
/* =========================
   保存
========================= */
let opponent=[];
let mine=[];
try{
  opponent=JSON.parse(localStorage.getItem("pokemon_opp")||"[]");
  mine=JSON.parse(localStorage.getItem("pokemon_my")||"[]");
  if(!Array.isArray(opponent)) opponent=[];
  if(!Array.isArray(mine)) mine=[];
}catch(e){
  opponent=[];
  mine=[];
}
opponent=opponent.filter(x=>P.some(p=>p.name===x));
mine=mine.filter(x=>P.some(p=>p.name===x));
function save(){
  localStorage.setItem("pokemon_opp",JSON.stringify(opponent));
  localStorage.setItem("pokemon_my",JSON.stringify(mine));
}
/* =========================
   カード
========================= */
function card(p,selected,disabled,click){
  const div=document.createElement("div");
  div.className="card"+
    (selected?" selected":"")+
    (disabled?" disabled":"");
  div.innerHTML=`
    <span class="number">${selected?"✓":""}</span>
    <img src="${image(p.id)}" alt="${p.name}">
    <div class="card-name">${p.name}</div>
  `;
  if(!disabled){
    let done=false;
    const handler=e=>{
      if(done) return;
      done=true;
      if(e) e.preventDefault();
      click();
      setTimeout(()=>done=false,250);
    };
    div.addEventListener("pointerup",handler,{passive:false});
    div.addEventListener("touchend",handler,{passive:false});
    div.addEventListener("click",handler);
  }
  return div;
}
/* =========================
   選択
========================= */
function toggle(list,name){
  const i=list.indexOf(name);
  if(i>=0){
    list.splice(i,1);
    return;
  }
  if(list.length>=6){
    alert("6体まで選択できます。");
    return;
  }
  list.push(name);
}
/* =========================
   選択済み表示
========================= */
function renderSelected(list,targetId){
  const target=document.getElementById(targetId);
  target.innerHTML="";
  for(let i=0;i<6;i++){
    const slot=document.createElement("div");
    slot.className="slot";
    if(list[i]){
      const p=P.find(x=>x.name===list[i]);
      if(p){
        slot.innerHTML=`
          <img src="${image(p.id)}" alt="${p.name}">
          <div class="slot-name">${p.name}</div>
        `;
      }
    }else{
      slot.textContent="空き";
    }
    target.appendChild(slot);
  }
}
/* =========================
   一覧表示
========================= */
function renderGrid(list,gridId,selectedList,selectedId){
  const grid=document.getElementById(gridId);
  grid.innerHTML="";
  P.forEach(p=>{
    const selected=selectedList.includes(p.name);
    const disabled=!selected &&
      selectedList.length>=6;
    grid.appendChild(
      card(
        p,
        selected,
        disabled,
        ()=>{
          toggle(selectedList,p.name);
          save();
          renderAll();
        }
      )
    );
  });
  renderSelected(selectedList,selectedId);
}
/* =========================
   全体表示
========================= */
function renderAll(){
  document.getElementById("oppCount").textContent=
    opponent.length+" / 6";
  document.getElementById("myCount").textContent=
    mine.length+" / 6";
  renderGrid(
    opponent,
    "oppGrid",
    opponent,
    "oppSelected"
  );
  renderGrid(
    mine,
    "myGrid",
    mine,
    "mySelected"
  );
  renderSearch(
    "oppSearch",
    "oppSuggestions",
    opponent
  );
  renderSearch(
    "mySearch",
    "mySuggestions",
    mine
  );
}
/* =========================
   検索候補
========================= */
function renderSearch(inputId,suggestionsId,list){
  const input=document.getElementById(inputId);
  const box=document.getElementById(suggestionsId);
  const q=input.value.trim();
  box.innerHTML="";
  const results=searchPokemon(q).slice(0,q?8:12);
  results.forEach(p=>{
    if(list.includes(p.name)) return;
    const b=document.createElement("button");
    b.type="button";
    b.className="suggestion";
    b.innerHTML=`
      <img
        src="${image(p.id)}"
        style="width:34px;height:34px;vertical-align:middle;object-fit:contain;margin-right:8px;"
      >
      ${p.name}
    `;
    let done=false;
    const choose=e=>{
      if(done) return;
      done=true;
      if(e) e.preventDefault();
      if(list.length>=6){
        alert("6体まで選択できます。");
        done=false;
        return;
      }
      list.push(p.name);
      input.value="";
      save();
      renderAll();
      setTimeout(()=>done=false,250);
    };
    b.addEventListener("pointerup",choose,{passive:false});
    b.addEventListener("touchend",choose,{passive:false});
    b.addEventListener("click",choose);
    box.appendChild(b);
  });
}

/* =========================
   相性計算
========================= */
function attackScore(attacker,defender){
  let best=1;
  attacker.type.forEach(atk=>{
    let mult=1;
    defender.type.forEach(def=>{
      if(effectiveness[atk] &&
         effectiveness[atk][def]!==undefined){
        mult*=effectiveness[atk][def];
      }
    });
    if(mult>best) best=mult;
  });
  return best;
}

========================= */
document.getElementById("judge").addEventListener("click",()=>{
  const result=document.getElementById("result");
  result.classList.remove("hidden");
  if(mine.length<6){
    result.innerHTML=`
      <h3>⚠️ 自分の6体を登録してください</h3>
      <div class="note">
        下のポケモン画像をタップするか、検索欄から6体選択してください。
      </div>
    `;
    return;
  }
  if(opponent.length<6){
    result.innerHTML=`
      <h3>⚠️ 相手の6体を登録してください</h3>
      <div class="note">
        相手の6体を画像タップまたは名前検索で選択してください。
      </div>
    `;
    return;
  }
  const enemies=opponent
    .map(n=>P.find(p=>p.name===n))
    .filter(Boolean);
  const candidates=mine
    .map(n=>P.find(p=>p.name===n))
    .filter(Boolean);
  const scores=candidates.map(me=>{
    let score=0;
    enemies.forEach(enemy=>{
      const offense=attackScore(me,enemy);
      const defense=attackScore(enemy,me);
      if(offense>=2) score+=4;
      else if(offense>1) score+=2;
      else if(offense===1) score+=1;
      if(defense>=2) score-=2;
      else if(defense>1) score-=1;
      else if(defense===0) score+=2;
    });
    return {pokemon:me,score};
  });
  scores.sort((a,b)=>b.score-a.score);
  const selected=scores.slice(0,3);
  result.innerHTML=`
    <h3>🏆 おすすめ選出</h3>
    ${selected.map((x,i)=>`
      <div class="result-item">
        <strong>${i+1}位　${x.pokemon.name}</strong>
        <span class="good">　スコア ${x.score}</span>
      </div>
    `).join("")}
    <div class="note">
      ※タイプ相性を中心にした簡易選出判定です。
      実戦では特性・技・持ち物・能力・素早さ・交代先なども影響します。
    </div>
  `;
});
