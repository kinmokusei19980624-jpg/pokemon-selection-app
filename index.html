<title>ポケモンチャンピオンズ 選出アシスタント</title>

<style>
*{

  -webkit-tap-highlight-color:transparent;

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#0f172a;
  color:#f8fafc;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#111827;
  padding:14px 14px 12px;
  border-bottom:1px solid #334155;
}

h1{
  margin:0;
  font-size:20px;
}

.sub{
  margin-top:4px;
  color:#94a3b8;
  font-size:12px;
}

main{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.panel{
  background:#1e293b;
  border:1px solid #334155;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
}

.panel-title{
  font-weight:800;
  margin-bottom:10px;
  font-size:16px;
}

.search-wrap{
  position:relative;
}

.search{
  width:100%;
  padding:13px 14px;
  border-radius:10px;
  border:1px solid #475569;
  background:#0f172a;
  color:white;
  font-size:16px;
  outline:none;
}

.search:focus{
  border-color:#60a5fa;
}

.suggestions{
  position:absolute;
  left:0;
  right:0;
  top:52px;
  z-index:100;
  background:#111827;
  border:1px solid #475569;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
  max-height:300px;
  overflow-y:auto;
}

.suggestion{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 10px;
  border-bottom:1px solid #273449;
  cursor:pointer;
}

.suggestion:last-child{
  border-bottom:none;
}

.suggestion:active{
  background:#334155;
}

.suggestion img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.s-name{
  font-weight:700;
}

.s-meta{
  color:#94a3b8;
  font-size:11px;
  margin-top:2px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

.slot{
  min-height:105px;
  background:#0f172a;
  border:1px solid #334155;
  border-radius:12px;
  padding:7px;
  position:relative;
  cursor:pointer;
}

.slot.selected{
  border-color:#22c55e;
  box-shadow:0 0 0 2px rgba(34,197,94,.18);
}

.slot img{
  display:block;
  width:65px;
  height:65px;
  margin:0 auto 2px;
  object-fit:contain;
}

.slot-name{
  text-align:center;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.slot-empty{
  color:#64748b;
  text-align:center;
  padding-top:25px;
  font-size:13px;
}

.remove{
  position:absolute;
  right:5px;
  top:5px;
  width:24px;
  height:24px;
  border:0;
  border-radius:50%;
  background:#ef4444;
  color:white;
  font-weight:900;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-green{
  background:#16a34a;
  color:white;
}

.btn-gray{
  background:#475569;
  color:white;
}

.btn-red{
  background:#dc2626;
  color:white;
}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.result{
  background:#0f172a;
  border:1px solid #334155;
  border-radius:12px;
  padding:12px;
  line-height:1.6;
}

.result strong{
  color:#60a5fa;
}

.notice{
  color:#94a3b8;
  font-size:12px;
  line-height:1.5;
}

.badge{
  display:inline-block;
  padding:3px 7px;
  border-radius:999px;
  background:#334155;
  font-size:11px;
  margin:2px;
}

.selected-count{
  color:#60a5fa;
  font-weight:800;
}

.team-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.team-card{
  background:#0f172a;
  border:1px solid #334155;
  border-radius:10px;
  padding:8px;
  text-align:center;
}

.team-card img{
  width:65px;
  height:65px;
  object-fit:contain;
}

.team-card div{
  font-size:12px;
  font-weight:800;
}
</style>

<header>
  <h1>⚔️ ポケモンチャンピオンズ 選出アシスタント</h1>
  <div class="sub">シングル6体 → 3体選出 / iPhone対応</div>
</header>

<main>

<section class="panel">

    <button class="btn-red" onclick="resetAll()">全リセット</button>
  </div>

  <p class="notice">

  </p>
</section>

<section class="panel">
  <div class="panel-title">
    👿 相手の6体
    <span class="selected-count" id="oppCount">0 / 6</span>
  </div>

  <div class="search-wrap">
    <input
      id="oppSearch"
      class="search"
      type="text"
      autocomplete="off"
      placeholder="ポケモン名を入力（例：マス、イダ、カイ）"
    >
    <div id="oppSuggestions" class="suggestions"></div>
  </div>

  <br>

  <div id="oppGrid" class="grid"></div>
</section>

<section class="panel">
  <div class="panel-title">
    🏠 自分の6体
    <span class="selected-count" id="myCount">0 / 6</span>
  </div>

  <div class="search-wrap">
    <input
      id="mySearch"
      class="search"
      type="text"
      autocomplete="off"
      placeholder="自分のポケモンを検索"
    >
    <div id="mySuggestions" class="suggestions"></div>
  </div>

  <br>

  <div id="myGrid" class="grid"></div>
</section>

<section class="panel">

  <br><br>

  <div id="result" class="result">
    相手6体と自分6体を登録してください。

</section>

</main>

/* =========================================================

   ========================================================= */

const ALIAS = {
  "ます":"マスカーニャ",
  "ますか":"マスカーニャ",
  "ますかーにゃ":"マスカーニャ",

  "いだ":"イダイトウ♂",

/* =========================================================

   ========================================================= */

let oppSel = JSON.parse(localStorage.getItem("oppSel") || "[]");
let mySel  = JSON.parse(localStorage.getItem("mySel") || "[]");

/* =========================================================
   画像
   ========================================================= */

function imgUrl(id){
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
}

/* =========================================================
   検索
   ========================================================= */

function normalize(s){
  return String(s || "")
    .toLowerCase()
    .replaceAll(" ","")
    .replaceAll("　","")
    .replaceAll("・","")
    .replaceAll("-","")
    .replaceAll("ー","");
}

function searchPokemon(query){

  const q = normalize(query);

  if(!q){
    return P.slice(0,20);
  }

  const alias = Object.keys(ALIAS)
    .filter(a => normalize(a).startsWith(q))
    .map(a => ALIAS[a]);

  const results = [];

  alias.forEach(name=>{
    const p = P.find(x=>x[0]===name);
    if(p && !results.includes(p)) results.push(p);
  });

  P.forEach(p=>{
    const name = normalize(p[0]);

    if(
      name.startsWith(q) ||
      name.includes(q)
    ){
      if(!results.includes(p)) results.push(p);
    }
  });

  return results.slice(0,15);
}

/* =========================================================
   候補表示
   ========================================================= */

function showSuggestions(mode){

  const input =
    mode==="opp"
    ? document.getElementById("oppSearch")
    : document.getElementById("mySearch");

  const box =
    mode==="opp"
    ? document.getElementById("oppSuggestions")
    : document.getElementById("mySuggestions");

  const list = searchPokemon(input.value);

  box.innerHTML="";

  list.forEach(p=>{

    const div=document.createElement("div");
    div.className="suggestion";

    div.innerHTML=`
      <img src="${imgUrl(p[1])}" alt="">
      <div>
        <div class="s-name">${p[0]}</div>
        <div class="s-meta">
          ${p[2]}${p[3] ? " / "+p[3] : ""}
        </div>
      </div>
    `;

    div.onclick=()=>{
      addPokemon(mode,p[0]);
      input.value="";
      box.innerHTML="";
    };

    box.appendChild(div);
  });
}

/* =========================================================
   ポケモン追加
   ========================================================= */

function addPokemon(mode,name){

  const target = mode==="opp" ? oppSel : mySel;

  if(target.includes(name)){
    return;
  }

  if(target.length>=6){
    alert("6体まで選択できます。");
    return;
  }

  target.push(name);

  saveState();
  renderAll();
}

/* =========================================================
   削除
   ========================================================= */

function removePokemon(mode,index){

  if(mode==="opp"){
    oppSel.splice(index,1);
  }else{
    mySel.splice(index,1);
  }

  saveState();
  renderAll();
}

/* =========================================================
   表示
   ========================================================= */

function render(mode){

  const target = mode==="opp" ? oppSel : mySel;

  const grid =
    mode==="opp"
    ? document.getElementById("oppGrid")
    : document.getElementById("myGrid");

  const count =
    mode==="opp"
    ? document.getElementById("oppCount")
    : document.getElementById("myCount");

  grid.innerHTML="";

  count.textContent=`${target.length} / 6`;

  for(let i=0;i<6;i++){

    const div=document.createElement("div");
    div.className="slot";

    if(target[i]){

      const p=P.find(x=>x[0]===target[i]);

      if(p){

        div.innerHTML=`
          <button class="remove">×</button>
          <img src="${imgUrl(p[1])}" alt="">
          <div class="slot-name">${p[0]}</div>
        `;

        div.querySelector(".remove").onclick=(e)=>{
          e.stopPropagation();
          removePokemon(mode,i);
        };
      }

    }else{

      div.innerHTML=`
        <div class="slot-empty">
          ${i+1}体目<br>
          検索して追加
        </div>
      `;
    }

    grid.appendChild(div);
  }
}

function renderAll(){
  render("opp");
  render("my");
}

/* =========================================================
   保存
   ========================================================= */

function saveState(){
  localStorage.setItem("oppSel",JSON.stringify(oppSel));
  localStorage.setItem("mySel",JSON.stringify(mySel));
}

function saveTeam(){

  saveState();

  alert(
    "自分の6体を保存しました。\n\n"+
    mySel.join(" / ")
  );
}

/* =========================================================
   リセット
   ========================================================= */

function resetAll(){

  if(!confirm("登録したポケモンをすべて削除しますか？")){
    return;
  }

  oppSel=[];
  mySel=[];

  saveState();
  renderAll();

  document.getElementById("result").innerHTML=
    "相手6体と自分6体を登録してください。";
}

/* =========================================================
   相性倍率
   ========================================================= */

function typeEffect(attacker,defenderTypes){

  let value=1;

  defenderTypes.forEach(type=>{
    if(EFFECTIVE[attacker] &&
       EFFECTIVE[attacker][type] !== undefined){

      value *= EFFECTIVE[attacker][type];
    }
  });

  return value;
}

   ========================================================= */

function scorePokemon(p, enemies){

  let score=50;

  const attackTypes=[];

  if(p[2]) attackTypes.push(p[2]);
  if(p[3]) attackTypes.push(p[3]);

  enemies.forEach(enemyName=>{

    const e=P.find(x=>x[0]===enemyName);

    if(!e) return;

    let best=0;

    attackTypes.forEach(t=>{
      best=Math.max(
        best,
        typeEffect(t,[e[2],e[3]].filter(Boolean))
      );
    });

    if(best>=4) score+=25;
    else if(best>=2) score+=15;
    else if(best===1) score+=5;
    else if(best<1) score-=10;
  });

  return score;
}

/* =========================================================
   判定
   ========================================================= */

function judge(){

  const result=document.getElementById("result");

  if(mySel.length<6){
    result.innerHTML=
      "⚠️ <strong>自分の6体</strong>を登録してください。";
    return;
  }

  if(oppSel.length<6){
    result.innerHTML=
      "⚠️ <strong>相手の6体</strong>を登録してください。";
    return;
  }

  const scored=mySel.map(name=>{

    const p=P.find(x=>x[0]===name);

    return {
      name,
      score:scorePokemon(p,oppSel)
    };
  });

  scored.sort((a,b)=>b.score-a.score);

  const best=scored.slice(0,3);

  result.innerHTML=`
    <h3>🏆 おすすめ選出</h3>

    <div class="team-row">
      ${best.map(x=>{
        const p=P.find(y=>y[0]===x.name);

        return `
          <div class="team-card">
            <img src="${imgUrl(p[1])}">
            <div>${p[0]}</div>
          </div>
        `;
      }).join("")}
    </div>

    <br>

    <strong>選出順位</strong><br>

    ${scored.map((x,i)=>
      `${i+1}位　${x.name}　評価 ${x.score}`
    ).join("<br>")}

    <br><br>

    <span class="notice">
      ※これはタイプ相性を中心にした簡易選出判定です。
    </span>
  `;
}
