<!DOCTYPE html>
<html lang="ja">

<meta name="apple-mobile-web-app-title" content="ポケモン選出">
<meta name="theme-color" content="#0f172a">

<title>ポケモンチャンピオンズ 選出アシスタント</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#0f172a;
}

body{
  color:#f8fafc;
  font-family:-apple-system,BlinkMacSystemFont,
    "Helvetica Neue","Hiragino Kaku Gothic ProN",
    "Yu Gothic",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}

button,
input{
  font-family:inherit;
}

button{
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#111827;
  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    12px;
  border-bottom:1px solid #334155;
}

h1{
  margin:0;
  font-size:19px;
  line-height:1.3;
}

.sub{
  margin-top:4px;
  color:#94a3b8;
  font-size:12px;
}

main{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:12px;
  padding-bottom:30px;
}

.panel{
  background:#1e293b;
  border:1px solid #334155;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
}

.panel-title{
  font-weight:800;
  margin-bottom:10px;
  font-size:16px;
}

.search-wrap{
  position:relative;
  z-index:20;
}

.search{
  width:100%;
  height:48px;
  padding:0 14px;
  border-radius:10px;
  border:1px solid #475569;
  background:#0f172a;
  color:white;
  font-size:16px;
  outline:none;
  -webkit-appearance:none;
  appearance:none;
}

.search:focus{
  border-color:#60a5fa;
}

.search::placeholder{
  color:#64748b;
}

.suggestions{
  position:absolute;
  left:0;
  right:0;
  top:52px;
  z-index:9999;

  background:#111827;
  border:1px solid #475569;
  border-radius:10px;

  overflow:hidden;
  overflow-y:auto;

  max-height:320px;

  box-shadow:0 12px 30px rgba(0,0,0,.55);

  -webkit-overflow-scrolling:touch;
}

.suggestions:empty{
  display:none;
}

.suggestion{
  display:flex;
  align-items:center;
  gap:10px;

  width:100%;
  min-height:62px;

  padding:8px 10px;

  background:#111827;
  color:#fff;

  border:0;
  border-bottom:1px solid #273449;

  text-align:left;

  cursor:pointer;

  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;

  -webkit-appearance:none;
  appearance:none;
}

.suggestion:last-child{
  border-bottom:none;
}

.suggestion:active{
  background:#334155;
}

.suggestion img{
  width:44px;
  height:44px;
  object-fit:contain;
  flex:none;
  pointer-events:none;
}

.suggestion-text{
  pointer-events:none;
}

.s-name{
  font-weight:800;
  font-size:14px;
}

.s-meta{
  color:#94a3b8;
  font-size:11px;
  margin-top:2px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

.slot{
  min-height:108px;

  background:#0f172a;
  border:1px solid #334155;
  border-radius:12px;

  padding:7px;

  position:relative;

  cursor:pointer;

  touch-action:manipulation;
}

.slot img{
  display:block;
  width:68px;
  height:68px;
  margin:0 auto 2px;
  object-fit:contain;

  pointer-events:none;
}

.slot-name{
  text-align:center;
  font-size:13px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.slot-empty{
  color:#64748b;
  text-align:center;
  padding-top:26px;
  font-size:13px;
  pointer-events:none;
}

.remove{
  position:absolute;
  right:5px;
  top:5px;

  width:27px;
  height:27px;

  padding:0;

  border:0;
  border-radius:50%;

  background:#ef4444;
  color:white;

  font-size:18px;
  font-weight:900;
  line-height:27px;

  z-index:5;

  touch-action:manipulation;
}

button{
  border:0;
  border-radius:10px;

  min-height:44px;

  padding:10px 14px;

  font-size:14px;
  font-weight:800;

  cursor:pointer;
}

.btn-green{
  background:#16a34a;
  color:white;
}

.btn-gray{
  background:#475569;
  color:white;
}

.btn-red{
  background:#dc2626;
  color:white;
}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.notice{
  color:#94a3b8;
  font-size:12px;
  line-height:1.5;
}

.selected-count{
  color:#60a5fa;
  font-weight:800;
}

.result{
  background:#0f172a;
  border:1px solid #334155;
  border-radius:12px;
  padding:12px;
  line-height:1.6;
}

.result strong{
  color:#60a5fa;
}

.team-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.team-card{
  background:#0f172a;
  border:1px solid #334155;
  border-radius:10px;
  padding:8px;
  text-align:center;
}

.team-card img{
  width:65px;
  height:65px;
  object-fit:contain;
}

.team-card div{
  font-size:12px;
  font-weight:800;
}

.empty-message{
  color:#64748b;
  font-size:12px;
  padding:8px 2px;
}
</style>
</head>

<body>

<header>
  <h1>⚔️ ポケモンチャンピオンズ 選出アシスタント</h1>
  <div class="sub">シングル6体 → 3体選出 / iPhone・ホーム画面対応</div>
</header>

<main>

<!-- 設定 -->

<section class="panel">

  <div class="panel-title">⚙️ 設定</div>

  <div class="buttons">

    <button
      type="button"
      class="btn-gray"
      id="saveTeamBtn">
      自分の6体を保存
    </button>

    <button
      type="button"
      class="btn-red"
      id="resetBtn">
      全リセット
    </button>

  </div>

  <p class="notice">
    自分の6体は保存され、次回起動時もそのまま使用できます。
  </p>

</section>


<!-- 相手 -->

<section class="panel">

  <div class="panel-title">

    👿 相手の6体

    <span
      class="selected-count"
      id="oppCount">
      0 / 6
    </span>

  </div>


  <div class="search-wrap">

    <input
      id="oppSearch"
      class="search"
      type="search"
      inputmode="search"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="ポケモン名を入力（例：マス・イダ・カイ）">

    <div
      id="oppSuggestions"
      class="suggestions">
    </div>

  </div>


  <br>

  <div
    id="oppGrid"
    class="grid">
  </div>

</section>


<!-- 自分 -->

<section class="panel">

  <div class="panel-title">

    🏠 自分の6体

    <span
      class="selected-count"
      id="myCount">
      0 / 6
    </span>

  </div>


  <div class="search-wrap">

    <input
      id="mySearch"
      class="search"
      type="search"
      inputmode="search"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="自分のポケモンを検索">

    <div
      id="mySuggestions"
      class="suggestions">
    </div>

  </div>


  <br>

  <div
    id="myGrid"
    class="grid">
  </div>

</section>


<!-- 判定 -->

<section class="panel">

  <div class="panel-title">
    🏆 選出判定
  </div>

  <button
    type="button"
    class="btn-green"
    id="judgeBtn"
    style="width:100%;">
    おすすめ3体を判定
  </button>

  <br><br>

  <div
    id="result"
    class="result">

    相手6体と自分6体を登録してください。

  </div>

</section>

</main>

/* =========================================================
   画像IDの特殊処理
   ========================================================= */

function AlolanNinetalesId(){
  return 101;
}


/* =========================================================
   追加検索用の別名
   ========================================================= */

const ALIAS = {

  "ます":"マスカーニャ",
  "ますか":"マスカーニャ",
  "ますかーにゃ":"マスカーニャ",

  "いだ":"イダイトウ♂",
  "いだい":"イダイトウ♂",
  "いだいとう":"イダイトウ♂",
  "いだいとうおす":"イダイトウ♂",
  "いだいとうめす":"イダイトウ♀",

  "かい":"カイリュー",
  "かいり":"カイリュー",
  "かいりゅう":"カイリュー",

  "がぶ":"ガブリアス",
  "がぶり":"ガブリアス",

  "さーふ":"サーフゴー",
  "さーふごー":"サーフゴー",

  "きら":"キラフロル",
  "きらふろる":"キラフロル",

  "ぶり":"ブリジュラス",
  "ぶりじゅ":"ブリジュラス",

  "あし":"アシレーヌ",
  "あしれ":"アシレーヌ",

  "ぺり":"ペリッパー",
  "ぺりっ":"ペリッパー",

  "らぐ":"ラグラージ",
  "らぐら":"ラグラージ",

  "ばしゃ":"バシャーモ",
  "ばしゃー":"バシャーモ",

  "ぺん":"ペンドラー",
  "ぺんど":"ペンドラー",

  "える":"エルフーン",
  "えるふ":"エルフーン",

  "おーろん":"オーロンゲ",
  "おろん":"オーロンゲ",

  "りざ":"リザードン",
  "りざー":"リザードン",

  "げん":"ゲンガー",
  "げんが":"ゲンガー",

  "みみ":"ミミッキュ",
  "みみっ":"ミミッキュ",

  "どど":"ドドゲザン",
  "どどげ":"ドドゲザン",

  "かば":"カバルドン",
  "かばる":"カバルドン"

};


/* =========================================================
   状態
   ========================================================= */

let oppSel = loadArray("oppSel");
let mySel  = loadArray("mySel");


function loadArray(key){

  try{

    const data = localStorage.getItem(key);

    if(!data){
      return [];
    }

    const parsed = JSON.parse(data);

    return Array.isArray(parsed) ? parsed : [];

  }catch(e){

    return [];

  }

}


/* =========================================================
   保存
   ========================================================= */

function saveState(){

  try{

    localStorage.setItem(
      "oppSel",
      JSON.stringify(oppSel)
    );

    localStorage.setItem(
      "mySel",
      JSON.stringify(mySel)
    );

  }catch(e){

    console.log("保存エラー",e);

  }

}


/* =========================================================
   画像
   ========================================================= */

function imgUrl(id){

  return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/" +
         id +
         ".png";

}


/* =========================================================
   検索文字の正規化
   ========================================================= */

function normalize(s){

  return String(s || "")
    .toLowerCase()
    .replace(/[\s　]/g,"")
    .replace(/[・\-_]/g,"")
    .replace(/ー/g,"");

}


/* =========================================================
   検索
   ========================================================= */

function searchPokemon(query){

  const q = normalize(query);

  if(!q){

    return P.slice(0,20);

  }


  const results = [];


  /* 別名 */

  Object.keys(ALIAS).forEach(alias=>{

    if(
      normalize(alias).startsWith(q) ||
      q.startsWith(normalize(alias))
    ){

      const name=ALIAS[alias];

      const p=P.find(x=>x[0]===name);

      if(p && !results.includes(p)){

        results.push(p);

      }

    }

  });


  /* 通常検索 */

  P.forEach(p=>{

    const name=normalize(p[0]);

    if(
      name.startsWith(q) ||
      name.includes(q)
    ){

      if(!results.includes(p)){

        results.push(p);

      }

    }

  });


  return results.slice(0,15);

}


/* =========================================================
   候補表示
   ========================================================= */

function showSuggestions(mode){

  const input =
    mode==="opp"
      ? document.getElementById("oppSearch")
      : document.getElementById("mySearch");


  const box =
    mode==="opp"
      ? document.getElementById("oppSuggestions")
      : document.getElementById("mySuggestions");


  const list=searchPokemon(input.value);


  box.innerHTML="";


  list.forEach(p=>{

    const button=document.createElement("button");

    button.type="button";
    button.className="suggestion";


    button.innerHTML=`

      <img
        src="${imgUrl(p[1])}"
        alt=""
        draggable="false">

      <div class="suggestion-text">

        <div class="s-name">
          ${p[0]}
        </div>

        <div class="s-meta">
          ${p[2]}${p[3] ? " / "+p[3] : ""}
        </div>

      </div>

    `;


    /*
      iPhoneホーム画面対応

      clickだけに頼らず
      pointerupでも処理する。
    */

    let handled=false;


    function select(){

      if(handled){
        return;
      }

      handled=true;

      addPokemon(mode,p[0]);

      input.value="";

      closeSuggestions(mode);

      setTimeout(()=>{

        handled=false;

      },400);

    }


    button.addEventListener(
      "pointerup",
      function(e){

        e.preventDefault();
        e.stopPropagation();

        select();

      },
      {passive:false}
    );


    button.addEventListener(
      "touchend",
      function(e){

        e.preventDefault();
        e.stopPropagation();

        select();

      },
      {passive:false}
    );


    button.addEventListener(
      "click",
      function(e){

        e.preventDefault();
        e.stopPropagation();

        select();

      }
    );


    box.appendChild(button);

  });

}


/* =========================================================
   候補を閉じる
   ========================================================= */

function closeSuggestions(mode){

  const box =
    mode==="opp"
      ? document.getElementById("oppSuggestions")
      : document.getElementById("mySuggestions");

  box.innerHTML="";

}


/* =========================================================
   ポケモン追加
   ========================================================= */

function addPokemon(mode,name){

  const target =
    mode==="opp"
      ? oppSel
      : mySel;


  if(target.includes(name)){

    return;

  }


  if(target.length>=6){

    alert("6体まで選択できます。");

    return;

  }


  target.push(name);


  saveState();

  renderAll();

}


/* =========================================================
   ポケモン削除
   ========================================================= */

function removePokemon(mode,index){

  if(mode==="opp"){

    oppSel.splice(index,1);

  }else{

    mySel.splice(index,1);

  }


  saveState();

  renderAll();

}


/* =========================================================
   グリッド表示
   ========================================================= */

function render(mode){

  const target =
    mode==="opp"
      ? oppSel
      : mySel;


  const grid =
    mode==="opp"
      ? document.getElementById("oppGrid")
      : document.getElementById("myGrid");


  const count =
    mode==="opp"
      ? document.getElementById("oppCount")
      : document.getElementById("myCount");


  grid.innerHTML="";


  count.textContent=
    target.length+" / 6";


  for(let i=0;i<6;i++){

    const div=document.createElement("div");

    div.className="slot";


    if(target[i]){

      const p=P.find(
        x=>x[0]===target[i]
      );


      if(p){

        div.innerHTML=`

          <button
            type="button"
            class="remove"
            aria-label="削除">
            ×
          </button>

          <img
            src="${imgUrl(p[1])}"
            alt=""
            draggable="false">

          <div class="slot-name">
            ${p[0]}
          </div>

        `;


        const remove=
          div.querySelector(".remove");


        remove.addEventListener(
          "pointerup",
          function(e){

            e.preventDefault();
            e.stopPropagation();

            removePokemon(mode,i);

          },
          {passive:false}
        );

      }

    }else{

    }


    grid.appendChild(div);

  }

}

/* =========================================================
   タイプ相性計算
   ========================================================= */

function typeEffect(attacker,defenderTypes){

  let value=1;


  defenderTypes.forEach(type=>{

    if(
      EFFECTIVE[attacker] &&
      EFFECTIVE[attacker][type] !== undefined
    ){

      value *= EFFECTIVE[attacker][type];

    }

  });


  return value;

}


/* =========================================================
   選出評価
   ========================================================= */

function scorePokemon(p,enemies){

  if(!p){
    return -999;
  }


  let score=50;


  const attackTypes=[];


  if(p[2]){
    attackTypes.push(p[2]);
  }

  if(p[3]){
    attackTypes.push(p[3]);
  }


  enemies.forEach(enemyName=>{

    const enemy=
      P.find(x=>x[0]===enemyName);


    if(!enemy){
      return;
    }


    const defenderTypes=
      [enemy[2],enemy[3]]
      .filter(Boolean);


    let best=0;


    attackTypes.forEach(type=>{

      best=Math.max(
        best,
        typeEffect(type,defenderTypes)
      );

    });


    if(best>=4){

      score+=25;

    }else if(best>=2){

      score+=15;

    }else if(best===1){

      score+=5;

    }else if(best<1){

      score-=10;

    }

  });


  return score;

}


/* =========================================================
   判定
   ========================================================= */

function judge(){

  const result=
    document.getElementById("result");


  if(mySel.length<6){

    result.innerHTML=
      "⚠️ <strong>自分の6体</strong>を登録してください。";

    return;

  }


  if(oppSel.length<6){

    result.innerHTML=
      "⚠️ <strong>相手の6体</strong>を登録してください。";

    return;

  }


  const scored=
    mySel.map(name=>{

      const p=
        P.find(x=>x[0]===name);


      return{

        name:name,

        score:
          scorePokemon(
            p,
            oppSel
          )

      };

    });


  scored.sort(
    (a,b)=>b.score-a.score
  );


  const best=
    scored.slice(0,3);


  result.innerHTML=`

    <h3>🏆 おすすめ選出</h3>

    <div class="team-row">

      ${
        best.map(x=>{

          const p=
            P.find(y=>y[0]===x.name);


          return`

            <div class="team-card">

              <img
                src="${imgUrl(p[1])}"
                alt="">

              <div>
                ${p[0]}
              </div>

            </div>

          `;

        }).join("")
      }

    </div>

    <br>

    <strong>選出順位</strong>

    <br>

    ${
      scored.map((x,i)=>
        `${i+1}位　${x.name}　評価 ${x.score}`
      ).join("<br>")
    }

    <br><br>

    <span class="notice">
      ※タイプ相性を中心にした簡易選出判定です。
    </span>

  `;

}
