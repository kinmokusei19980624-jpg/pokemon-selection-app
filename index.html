<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>ポケモン選出アシスタント</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#eef2f7;color:#0f172a}
header{position:sticky;top:0;z-index:20;background:#0f172a;color:white;padding:14px 16px 13px;box-shadow:0 2px 12px #0002}
header h1{font-size:19px;margin:0 0 3px}header p{font-size:11px;margin:0;color:#cbd5e1}
main{max-width:760px;margin:auto;padding:12px 12px 40px}
.card{background:white;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0000000c}
h2{font-size:16px;margin:0 0 10px}
.small{font-size:11px;color:#64748b;line-height:1.5}
button{appearance:none;border:0;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:700;background:#2563eb;color:#fff;touch-action:manipulation}
button:active{transform:scale(.98)}
button.gray{background:#e2e8f0;color:#0f172a}
button.red{background:#dc2626}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.slot{min-height:94px;border:1px dashed #cbd5e1;border-radius:12px;background:#f8fafc;text-align:center;padding:5px}
.slot img{width:58px;height:58px;object-fit:contain;display:block;margin:auto}
.slot .nm{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding-top:31px;color:#94a3b8;font-size:11px}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font-size:15px;outline:none}
input:focus{border-color:#2563eb}
.filters{display:flex;gap:7px;margin:8px 0;overflow:auto}
.filters button{white-space:nowrap;padding:8px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.poke{display:flex;align-items:center;gap:7px;text-align:left;width:100%;min-height:76px;background:#fff;color:#0f172a;border:1px solid #e2e8f0;border-radius:13px;padding:6px;box-shadow:none}
.poke img{width:54px;height:54px;object-fit:contain;flex:0 0 54px}
.poke .nm{font-size:12px;font-weight:800}.poke .type{font-size:10px;color:#64748b;margin-top:2px}
.poke .rank{display:inline-block;font-size:9px;background:#eef2ff;color:#3730a3;border-radius:6px;padding:2px 5px;margin-top:4px}
.poke.selected{border:2px solid #2563eb;background:#eff6ff}
.result{background:#0f172a;color:white;border-radius:15px;padding:14px}
.result h2{margin:0 0 8px}.resultrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #ffffff20}
.resultrow:last-child{border-bottom:0}.score{font-weight:800}
.notice{margin-top:10px;background:#fff7ed;color:#9a3412;border-radius:10px;padding:9px;font-size:11px;line-height:1.5}
.hidden{display:none!important}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<h1>⚔️ ポケモン選出アシスタント</h1>
<p>自分の6体を保存 → 相手6体を選択 → 推奨3体を判定</p>
</header>

<main>
<section class="card">
<h2>① 自分の6体（固定）</h2>
<div id="myTeam" class="team"></div>
<div class="actions" style="margin-top:10px">
<button id="editMine">6体を設定・変更</button>
<button id="clearMine" class="gray">全消去</button>
</div>
<p class="small">設定した6体はこのSafariに保存されます。変更するまで毎回選び直す必要はありません。</p>
</section>

<section class="card">
<h2>② 相手の6体</h2>
<input id="search" type="search" placeholder="ポケモン名で検索">
<div class="filters">
<button id="usageBtn" class="gray">使用率順</button>
<button id="nameBtn" class="gray">名前順</button>
</div>
<div id="enemyTeam" class="team" style="margin-bottom:10px"></div>
<div id="picker" class="grid"></div>
</section>

<section class="card">
<button id="judge" style="width:100%;font-size:16px">🔥 最適選出を判定</button>
<div id="result" class="result hidden" style="margin-top:12px"></div>
</section>
</main>

<script>
(function(){
"use strict";

/* Champions用の選出候補リスト。
   「使用率」は表示順を作るための目安値です。公式ランキングそのものではありません。 */
const P=[
["カイリュー","ドラゴン / ひこう",149,100],
["ガブリアス","ドラゴン / じめん",445,98],
["メガカイリュー","ドラゴン / ひこう",149,97],
["サーフゴー","はがね / ゴースト",1000,96],
["メガゲンガー","ゴースト / どく",94,95],
["ミミッキュ","ゴースト / フェアリー",778,92],
["マスカーニャ","くさ / あく",908,91],
["ブリジュラス","はがね / ドラゴン",1018,90],
["アシレーヌ","みず / フェアリー",730,89],
["リザードン","ほのお / ひこう",6,88],
["メガリザードンY","ほのお / ひこう",6,87],
["メガギャラドス","みず / あく",130,86],
["ラグラージ","みず / じめん",260,85],
["メガラグラージ","みず / じめん",260,84],
["オーロンゲ","あく / フェアリー",861,83],
["ギルガルド","はがね / ゴースト",681,82],
["ブラッキー","あく",197,81],
["ペリッパー","みず / ひこう",279,80],
["イダイトウ","みず / ゴースト",902,79],
["バシャーモ","ほのお / かくとう",257,78],
["アーマーガア","はがね / ひこう",823,77],
["キラフロル","どく / いわ",970,76],
["ゲンガー","ゴースト / どく",94,75],
["カバルドン","じめん",450,74],
["ヘラクロス","むし / かくとう",214,73],
["ペンドラー","むし / どく",545,72],
["ヤミラミ","あく / ゴースト",302,70]
];

const TYPES={
"ほのお":["くさ","こおり","むし","はがね"],
"みず":["ほのお","じめん","いわ"],
"でんき":["みず","ひこう"],
"くさ":["みず","じめん","いわ"],
"こおり":["くさ","じめん","ひこう","ドラゴン"],
"かくとう":["ノーマル","こおり","いわ","あく","はがね"],
"どく":["くさ","フェアリー"],
"じめん":["ほのお","でんき","どく","いわ","はがね"],
"ひこう":["くさ","かくとう","むし"],
"エスパー":["かくとう","どく"],
"むし":["くさ","エスパー","あく"],
"いわ":["ほのお","こおり","ひこう","むし"],
"ゴースト":["エスパー","ゴースト"],
"ドラゴン":["ドラゴン"],
"あく":["エスパー","ゴースト"],
"フェアリー":["かくとう","ドラゴン","あく"],
"はがね":["こおり","いわ","フェアリー"]
};

const ids={
"カイリュー":149,"ガブリアス":445,"メガカイリュー":149,"サーフゴー":1000,
"メガゲンガー":94,"ミミッキュ":778,"マスカーニャ":908,"ブリジュラス":1018,
"アシレーヌ":730,"リザードン":6,"メガリザードンY":6,"メガギャラドス":130,
"ラグラージ":260,"メガラグラージ":260,"オーロンゲ":861,"ギルガルド":681,
"ブラッキー":197,"ペリッパー":279,"イダイトウ":902,"バシャーモ":257,
"アーマーガア":823,"キラフロル":970,"ゲンガー":94,"カバルドン":450,
"ヘラクロス":214,"ペンドラー":545,"ヤミラミ":302
};

let mine=[];
let enemy=[];
let mode="mine";
let sortMode="usage";

try{mine=JSON.parse(localStorage.getItem("champions_mine")||"[]")}catch(e){mine=[]}

function sprite(p){
  const id=ids[p[0]];
  return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/"+id+".png";
}
function get(name){return P.find(p=>p[0]===name)}
function esc(s){return s.replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}

function renderTeams(){
  const my=document.getElementById("myTeam");
  my.innerHTML="";
  for(let i=0;i<6;i++){
    const n=mine[i],p=get(n);
    if(p) my.innerHTML+='<div class="slot"><img src="'+sprite(p)+'" alt=""><div class="nm">'+esc(n)+'</div></div>';
    else my.innerHTML+='<div class="slot"><div class="empty">'+(i+1)+'体目</div></div>';
  }
  const en=document.getElementById("enemyTeam");
  en.innerHTML="";
  for(let i=0;i<6;i++){
    const n=enemy[i],p=get(n);
    if(p) en.innerHTML+='<div class="slot"><img src="'+sprite(p)+'" alt=""><div class="nm">'+esc(n)+'</div></div>';
    else en.innerHTML+='<div class="slot"><div class="empty">相手 '+(i+1)+'</div></div>';
  }
}

function renderPicker(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  let arr=P.filter(p=>p[0].toLowerCase().includes(q));
  if(sortMode==="usage") arr.sort((a,b)=>b[3]-a[3]);
  else arr.sort((a,b)=>a[0].localeCompare(b[0],"ja"));
  document.getElementById("picker").innerHTML=arr.map(p=>{
    const a=mode==="mine"?mine:enemy;
    const selected=a.indexOf(p[0])>=0;
    return '<button type="button" class="poke '+(selected?'selected':'')+'" data-name="'+esc(p[0])+'">'+
      '<img src="'+sprite(p)+'" alt="">'+
      '<span><span class="nm">'+esc(p[0])+'</span><br><span class="type">'+esc(p[1])+'</span><br><span class="rank">使用率目安 '+p[3]+'</span></span></button>';
  }).join("");
}

function toggle(name){
  const a=mode==="mine"?mine:enemy;
  const max=mode==="mine"?6:6;
  const i=a.indexOf(name);
  if(i>=0)a.splice(i,1);
  else if(a.length<max)a.push(name);
  else {alert("最大"+max+"体まで選択できます。");return}
  if(mode==="mine") localStorage.setItem("champions_mine",JSON.stringify(mine));
  renderTeams();renderPicker();
}

function typeParts(s){return s.split(" / ").map(x=>x.trim())}

function matchup(att,def){
  const at=typeParts(att), de=typeParts(def);
  let score=0;
  at.forEach(a=>de.forEach(d=>{if((TYPES[a]||[]).includes(d))score+=2}));
  return score;
}

function judge(){
  if(mine.length<6){alert("自分の6体を設定してください。");return}
  if(enemy.length<6){alert("相手の6体を選択してください。");return}

  const ranked=mine.map(name=>{
    const p=get(name);
    let s=p[3]/10;
    enemy.forEach(e=>{
      const ep=get(e);
      s+=matchup(p[1],ep[1]);
    });
    return {name,score:s};
  }).sort((a,b)=>b.score-a.score);

  const top=ranked.slice(0,3);
  const r=document.getElementById("result");
  r.classList.remove("hidden");
  r.innerHTML='<h2>🏆 推奨選出</h2>'+
    top.map((x,i)=>'<div class="resultrow"><span>'+(i+1)+'位　<b>'+esc(x.name)+'</b></span><span class="score">'+x.score.toFixed(1)+'</span></div>').join("")+
    '<div class="notice">この判定はタイプ相性と登録リストの使用率目安を使った簡易判定です。相手の技・特性・持ち物・メガ進化などを完全には再現していません。</div>';
}

document.getElementById("editMine").addEventListener("click",function(){
  mode="mine";document.getElementById("search").value="";renderPicker();
  document.getElementById("picker").scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("clearMine").addEventListener("click",function(){
  if(confirm("自分の6体を全部消しますか？")){mine=[];localStorage.removeItem("champions_mine");renderTeams();renderPicker()}
});
document.getElementById("search").addEventListener("input",renderPicker);
document.getElementById("usageBtn").addEventListener("click",function(){sortMode="usage";renderPicker()});
document.getElementById("nameBtn").addEventListener("click",function(){sortMode="name";renderPicker()});
document.getElementById("judge").addEventListener("click",judge);

/* 相手選択エリアは常に相手モード */
document.getElementById("enemyTeam").addEventListener("click",function(){});
document.getElementById("picker").addEventListener("click",function(e){
  const b=e.target.closest("button[data-name]");
  if(!b)return;
  toggle(b.dataset.name);
});

/* 6体設定中も同じ一覧を使う。最初は自分モード */
renderTeams();renderPicker();

/* 「相手6体」見出しをタップすると相手モード */
document.querySelector("h2:nth-of-type(2)");
document.getElementById("enemyTeam").previousElementSibling?.addEventListener("click",function(){mode="enemy";renderPicker()});
})();
</script>
</body>
</html>
