<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>ポケモンチャンピオンズ 選出アシスタント</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#0f172a;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:40px;
}

.container{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:16px 14px 40px;
}

h1{
  font-size:22px;
  margin:8px 0 5px;
  text-align:center;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  margin-bottom:15px;
}

.section{
  background:#1e293b;
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
}

.section-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
}

.count{
  color:#38bdf8;
  font-size:14px;
  margin-left:6px;
}

.search{
  width:100%;
  height:48px;
  border:1px solid #475569;
  border-radius:12px;
  background:#0f172a;
  color:#fff;
  padding:0 14px;
  font-size:16px;
  outline:none;
}

.search:focus{
  border-color:#38bdf8;
}

.search::placeholder{
  color:#64748b;
}

.suggestions{
  margin-top:8px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.suggestion{
  width:100%;
  min-height:46px;
  border:1px solid #334155;
  border-radius:11px;
  background:#273449;
  color:#fff;
  font-size:16px;
  text-align:left;
  padding:6px 12px;
  cursor:pointer;
  touch-action:manipulation;
  display:flex;
  align-items:center;
}

.suggestion:active{
  background:#0ea5e9;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

.card{
  position:relative;
  background:#0f172a;
  border:2px solid #334155;
  border-radius:12px;
  min-height:108px;
  padding:5px 4px;
  text-align:center;
  cursor:pointer;
  touch-action:manipulation;
  user-select:none;
}

.card:active{
  transform:scale(.97);
}

.card.selected{
  border-color:#38bdf8;
  background:#082f49;
  box-shadow:0 0 0 2px rgba(56,189,248,.18);
}

.card.disabled{
  opacity:.28;
}

.card img{
  width:68px;
  height:68px;
  object-fit:contain;
  display:block;
  margin:0 auto;
}

.card-name{
  font-size:10px;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.number{
  position:absolute;
  top:4px;
  right:5px;
  background:#334155;
  color:#cbd5e1;
  border-radius:8px;
  padding:2px 5px;
  font-size:10px;
}

.selected .number{
  background:#0284c7;
  color:#fff;
}

.selected-area{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
  margin-top:10px;
}

.slot{
  min-height:72px;
  border:1px dashed #475569;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:10px;
  color:#64748b;
  overflow:hidden;
}

.slot img{
  width:50px;
  height:50px;
  object-fit:contain;
}

.slot-name{
  color:#fff;
  font-size:9px;
  white-space:nowrap;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

button.action{
  flex:1;
  min-height:48px;
  border:0;
  border-radius:12px;
  font-size:15px;
  font-weight:700;
  color:#fff;
  background:#2563eb;
  touch-action:manipulation;
}

button.action.secondary{
  background:#475569;
}

button.action.danger{
  background:#b91c1c;
}

.result{
  background:#020617;
  border:1px solid #334155;
  border-radius:14px;
  padding:14px;
  margin-top:12px;
}

.result h3{
  margin:0 0 10px;
  font-size:17px;
}

.result-item{
  padding:11px 0;
  border-bottom:1px solid #1e293b;
}

.result-item:last-child{
  border-bottom:0;
}

.rank{
  font-size:17px;
  font-weight:700;
}

.good{
  color:#4ade80;
}

.bad{
  color:#f87171;
}

.neutral{
  color:#facc15;
}

.blue{
  color:#38bdf8;
}

.note{
  color:#94a3b8;
  font-size:12px;
  line-height:1.55;
  margin-top:8px;
}

.build{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:#111827;
  border:1px solid #334155;
  font-size:12px;
  line-height:1.6;
}

.build-title{
  color:#38bdf8;
  font-weight:700;
  margin-bottom:4px;
}

.threat{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:#111827;
  border-left:4px solid #facc15;
  font-size:12px;
  line-height:1.5;
}

.verdict{
  margin-top:10px;
  padding:12px;
  background:#082f49;
  border:1px solid #0ea5e9;
  border-radius:12px;
  font-size:14px;
  line-height:1.6;
}

.hidden{
  display:none!important;
}

@media(max-width:420px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }

  .card img{
    width:64px;
    height:64px;
  }

  .selected-area{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<div class="container">

<h1>⚔️ ポケモンチャンピオンズ</h1>

<div class="subtitle">
M-Bシングル対応・6体 → 勝率重視の3体自動選出
</div>

<!-- 相手 -->
<div class="section">

<div class="section-title">
相手の6体
<span class="count" id="oppCount">0 / 6</span>
</div>

<input
id="oppSearch"
class="search"
type="search"
autocomplete="off"
autocorrect="off"
autocapitalize="none"
spellcheck="false"
placeholder="相手のポケモンを検索"
>

<div id="oppSuggestions" class="suggestions"></div>

<div class="grid" id="oppGrid"></div>

<div class="selected-area" id="oppSelected"></div>

<div class="buttons">
<button class="action secondary" id="oppClear">
相手をリセット
</button>
</div>

</div>

<!-- 自分 -->
<div class="section">

<div class="section-title">
自分の6体
<span class="count" id="myCount">0 / 6</span>
</div>

<input
id="mySearch"
class="search"
type="search"
autocomplete="off"
autocorrect="off"
autocapitalize="none"
spellcheck="false"
placeholder="自分のポケモンを検索"
>

<div id="mySuggestions" class="suggestions"></div>

<div class="grid" id="myGrid"></div>

<div class="selected-area" id="mySelected"></div>

<div class="buttons">

<button class="action secondary" id="myClear">
自分をリセット
</button>

</div>

</div>

<!-- 判定 -->
<div class="section">

<div class="buttons">

<button class="action" id="judge">
⚔️ 最適な3体を自動選出
</button>

</div>

<div id="result" class="result hidden"></div>

</div>

</div>

/* =====================================================

===================================================== */

function normalize(s){
return(s||"")
.toLowerCase()
.replace(/[ 　]/g,"")
.replace(/ー/g,"");
}

function scorePokemon(p,q){

const n=normalize(q);

if(!n)return 999;

const name=normalize(p.name);

if(name===n)return 0;
if(name.startsWith(n))return 1;
if(name.includes(n))return 2;

if((p.aliases||[]).some(a=>normalize(a)===n))
return 0;

if((p.aliases||[]).some(a=>normalize(a).startsWith(n)))
return 1;

if((p.aliases||[]).some(a=>normalize(a).includes(n)))
return 2;

return 999;
}

function searchPokemon(q){

if(!q.trim()){

return P.slice().sort((a,b)=>{

let ai=priority.indexOf(a.name);
let bi=priority.indexOf(b.name);

if(ai<0&&bi<0)return 0;
if(ai<0)return 1;
if(bi<0)return -1;

return ai-bi;

});

}

return P
.map(p=>({p,s:scorePokemon(p,q)}))
.filter(x=>x.s<999)
.sort((a,b)=>{

if(a.s!==b.s)
return a.s-b.s;

let ai=priority.indexOf(a.p.name);
let bi=priority.indexOf(b.p.name);

if(ai<0&&bi<0)return 0;
if(ai<0)return 1;
if(bi<0)return -1;

return ai-bi;

})
.map(x=>x.p);

}

/* =====================================================
   相性
===================================================== */

function attackScore(attacker,defender){

let best=0;

attacker.type.forEach(atk=>{

let mult=1;

defender.type.forEach(def=>{

if(
effectiveness[atk] &&
effectiveness[atk][def]!==undefined
){

mult*=effectiveness[atk][def];

}

});

best=Math.max(best,mult);

});

return best||1;

}

/* =====================================================
   防御相性
===================================================== */

function defensiveScore(attacker,defender){

let mults=[];

attacker.type.forEach(atk=>{

let mult=1;

defender.type.forEach(def=>{

if(
effectiveness[atk] &&
effectiveness[atk][def]!==undefined
){

mult*=effectiveness[atk][def];

}

});

mults.push(mult);

});

return Math.min(...mults);

}

};

/* =====================================================
   環境補正
===================================================== */

function metaScore(name){

const i=priority.indexOf(name);

if(i<0)return 0;

return Math.max(0,20-i);

}

/* =====================================================
   個体評価
===================================================== */

function evaluatePokemon(me,enemies){

let score=0;

let offenseTotal=0;
let defenseTotal=0;
let superEffective=0;
let immune=0;

enemies.forEach(enemy=>{

const off=attackScore(me,enemy);
const def=defensiveScore(enemy,me);

offenseTotal+=off;
defenseTotal+=def;

if(off>=4){

score+=8;
superEffective++;

}else if(off>=2){

score+=5;
superEffective++;

}else if(off>1){

score+=3;

}else if(off===1){

score+=1;

}else{

score-=2;

}

if(def===0){

score+=5;
immune++;

}else if(def<1){

score+=4;

}else if(def<=.5){

score+=3;

}else if(def>=4){

score-=5;

}else if(def>=2){

score-=3;

}

});

/* 環境採用補正 */

score+=metaScore(me.name)*0.15;

/* 役割補正 */

const build=getBuild(me.name);

if(
build.moves.includes("ステルスロック") &&
enemies.length>=4
){

score+=1.5;

}

if(
build.moves.includes("おいかぜ") ||
build.moves.includes("でんじは")
){

score+=1;

}

if(
build.moves.includes("かげうち") ||
build.moves.includes("しんそく") ||
build.moves.includes("ふいうち")
){

score+=1;

}

return{

pokemon:me,
score,
offense:offenseTotal,
defense:defenseTotal,
superEffective,
immune

};

}

/* =====================================================
   3体組み合わせ評価
===================================================== */

function evaluateTeam(team,enemies){

let score=0;

/* 個体性能 */

team.forEach(me=>{

const e=evaluatePokemon(me,enemies);

score+=e.score;

});

/* タイプ補完 */

for(let i=0;i<team.length;i++){

for(let j=i+1;j<team.length;j++){

const a=team[i];
const b=team[j];

let complement=0;

enemies.forEach(enemy=>{

const aDef=defensiveScore(enemy,a);
const bDef=defensiveScore(enemy,b);

if(aDef>=2 && bDef<=.5)
complement+=3;

if(bDef>=2 && aDef<=.5)
complement+=3;

});

score+=complement;

}

}

/* 同じ役割だけにならないよう補正 */

const roles=
team.map(x=>getBuild(x.name).role);

const uniqueRoles=
new Set(roles).size;

score+=uniqueRoles*2;

/* 速度・先制技 */

if(
team.some(x=>
getBuild(x.name).moves.includes("かげうち") ||
getBuild(x.name).moves.includes("しんそく") ||
getBuild(x.name).moves.includes("ふいうち") ||
getBuild(x.name).moves.includes("アクアジェット")
)
){

score+=2;

}

/* ステロ */

if(
team.some(x=>
getBuild(x.name).moves.includes("ステルスロック")
)
){

score+=1.5;

}

return score;

}

/* =====================================================
   3体全組み合わせ
===================================================== */

function combinations(arr){

const result=[];

for(let i=0;i<arr.length;i++){

for(let j=i+1;j<arr.length;j++){

for(let k=j+1;k<arr.length;k++){

result.push([
arr[i],
arr[j],
arr[k]
]);

}

}

}

return result;

}

combinations(candidates)
.map(team=>({

score:evaluateTeam(team,enemies)

const best=

.map(p=>evaluatePokemon(p,enemies))
.sort((a,b)=>b.score-a.score);

const threats=

candidates.forEach(me=>{

if(s>bestAgainst){

bestAgainst=s;
bestName=me.name;

}

});

return{
enemy,
bestAgainst,
bestName
};

})
.sort((a,b)=>b.bestAgainst-a.bestAgainst);

result.innerHTML=`

<h3>🏆 勝率重視・最適3体</h3>

<div class="verdict">

<strong>推奨先発：</strong>
${individual[0].pokemon.name}

<br>

${individual[1].pokemon.name}

<br>

<strong>第3候補：</strong>
${individual[2].pokemon.name}

<br><br>

<strong>総合選出スコア：</strong>
${best.score.toFixed(1)}

</div>

${individual.map((x,i)=>{

const p=x.pokemon;
const b=getBuild(p.name);

return`

<div class="result-item">

<div class="rank">

${i+1}位　
${p.name}

<span class="good">
${x.score.toFixed(1)}点
</span>

</div>

<div class="build">

<div class="build-title">
⚙️ 推奨構成
</div>

<strong>特性：</strong>
${b.ability}

<br>

<strong>性格：</strong>
${b.nature}

<br>

<strong>能力：</strong>
${b.sp}

<br>

<strong>持ち物：</strong>
${b.item}

<br>

<strong>技：</strong>
${b.moves.join(" / ")}

<br>

<strong>役割：</strong>
${b.role}

</div>

<div class="note">

対面有利：
${x.superEffective}体

<br>

無効・大幅有利：
${x.immune}体

</div>

</div>

`;

}).join("")}

<div class="threat">

<strong>⚠️ 相手への警戒度</strong>

<br><br>

${threats.slice(0,5).map(t=>`

<div>

${t.enemy.name}
→
<strong>${t.bestName}</strong>

${
t.bestAgainst>=4
?'<span class="good">　非常に有利</span>'
:t.bestAgainst>=2
?'<span class="good">　有利</span>'
:t.bestAgainst===0
?'<span class="bad">　攻撃が通りにくい</span>'
:'<span class="neutral">　通常</span>'
}

</div>

`).join("")}

</div>

<div class="note">

※この判定は、現在のChampionsシングル環境を参考に、
タイプ相性・環境採用傾向・推奨型・持ち物・技構成・
役割・3体の補完関係を組み合わせた自動評価です。

実際の対戦では相手の型、テラスタル等の仕様、
技選択、急所、交代、読み合いなどによって結果は変化します。

</div>

`;

});
