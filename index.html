/* =====================================================
   検索用別名
   ===================================================== */

const ALIAS={

"ます":"マスカーニャ",
"ますか":"マスカーニャ",
"ますかーにゃ":"マスカーニャ",

"いだ":"イダイトウ",
"いだい":"イダイトウ",
"いだいとう":"イダイトウ",

"かい":"カイリュー",
"かいり":"カイリュー",
"かいりゅう":"カイリュー",

"がぶ":"ガブリアス",
"がぶり":"ガブリアス",

"さーふ":"サーフゴー",
"さーふごー":"サーフゴー",

"ぶり":"ブリジュラス",
"ぶりじゅ":"ブリジュラス",

"きら":"キラフロル",
"きらふ":"キラフロル",

"あし":"アシレーヌ",
"あしれ":"アシレーヌ",

"ぺり":"ペリッパー",
"ぺりっ":"ペリッパー",

"らぐ":"ラグラージ",
"らぐら":"ラグラージ",

"ばしゃ":"バシャーモ",
"ぺん":"ペンドラー",
"える":"エルフーン",
"おーろん":"オーロンゲ",
"どど":"ドドゲザン",
"かば":"カバルドン",
"りざ":"リザードン",
"げん":"ゲンガー",
"みみ":"ミミッキュ"

};


/* =====================================================
   状態
   ===================================================== */

let oppSel=[];
let mySel=[];


function load(){

 try{

  const a=
   JSON.parse(
    localStorage.getItem("pokemon_opp") || "[]"
   );

  const b=
   JSON.parse(
    localStorage.getItem("pokemon_my") || "[]"
   );

  if(Array.isArray(a)){
   oppSel=a.filter(name=>P.some(p=>p[0]===name));
  }

  if(Array.isArray(b)){
   mySel=b.filter(name=>P.some(p=>p[0]===name));
  }

 }catch(e){

  oppSel=[];
  mySel=[];

 }

}


function save(){

 localStorage.setItem(
  "pokemon_opp",
  JSON.stringify(oppSel)
 );

 localStorage.setItem(
  "pokemon_my",
  JSON.stringify(mySel)
 );

}


/* =====================================================
   画像
   ===================================================== */

function image(id){

 return
  "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/"
  +id+
  ".png";

}


/* =====================================================
   正規化
   ===================================================== */

function norm(text){

 return String(text||"")
  .toLowerCase()
  .replace(/[\s　]/g,"")
  .replace(/[・\-_]/g,"")
  .replace(/ー/g,"");

}


/* =====================================================
   検索
   ===================================================== */

function search(text){

 const q=norm(text);

 if(!q){

  return P.slice(0,20);

 }


 const result=[];


 Object.keys(ALIAS).forEach(key=>{

  if(norm(key).startsWith(q)){

   const name=ALIAS[key];

   const p=P.find(
    x=>x[0]===name
   );

   if(
    p &&
    !result.includes(p)
   ){

    result.push(p);

   }

  }

 });


 P.forEach(p=>{

  const name=norm(p[0]);

  if(
   name.startsWith(q) ||
   name.includes(q)
  ){

   if(!result.includes(p)){

    result.push(p);

   }

  }

 });


 return result.slice(0,15);

}


/* =====================================================
   候補表示
   ===================================================== */

function show(mode){

 const input=
  document.getElementById(
   mode==="opp"
    ?"oppSearch"
    :"mySearch"
  );

 const box=
  document.getElementById(
   mode==="opp"
    ?"oppSuggestions"
    :"mySuggestions"
  );


 const list=
  search(input.value);


 box.innerHTML="";


 list.forEach(p=>{

  const button=
   document.createElement("button");


  button.type="button";

  button.className="suggestion";


  button.innerHTML=

   '<img src="'+image(p[1])+'" alt="" draggable="false">'+

   '<div class="suggestionText">'+

   '<div class="suggestionName">'+
   p[0]+
   '</div>'+

   '<div class="suggestionType">'+
   p[2]+
   (p[3] ? " / "+p[3] : "")+
   '</div>'+

   '</div>';


  /*
    ここがホーム画面対応の重要部分
  */

  let done=false;


  function select(){

   if(done){
    return;
   }

   done=true;


   add(mode,p[0]);


   input.value="";

   box.innerHTML="";


   setTimeout(
    ()=>{
     done=false;
    },
    300
   );

  }


  button.addEventListener(
   "pointerup",
   function(e){

    e.preventDefault();
    e.stopPropagation();

    select();

   },
   {passive:false}
  );


  button.addEventListener(
   "touchend",
   function(e){

    e.preventDefault();
    e.stopPropagation();

    select();

   },
   {passive:false}
  );


  button.addEventListener(
   "click",
   function(e){

    e.preventDefault();
    e.stopPropagation();

    select();

   }
  );


  box.appendChild(button);

 });

}


/* =====================================================
   追加
   ===================================================== */

function add(mode,name){

 const arr=
  mode==="opp"
   ?oppSel
   :mySel;


 if(arr.includes(name)){

  return;

 }


 if(arr.length>=6){

  alert("6体まで選択できます。");

  return;

 }


 arr.push(name);


 save();

 render();

}


/* =====================================================
   削除
   ===================================================== */

function remove(mode,index){

 const arr=
  mode==="opp"
   ?oppSel
   :mySel;


 arr.splice(index,1);


 save();

 render();

}


/* =====================================================
   チーム表示
   ===================================================== */

function drawTeam(
 arr,
 gridId,
 countId,
 mode
){

 const grid=
  document.getElementById(gridId);

 const count=
  document.getElementById(countId);


 grid.innerHTML="";


 count.textContent=
  arr.length+" / 6";


 for(let i=0;i<6;i++){

  const slot=
   document.createElement("div");

  slot.className="slot";


  if(arr[i]){

   const p=
    P.find(
     x=>x[0]===arr[i]
    );


   if(p){

    slot.innerHTML=

     '<button type="button" class="remove">×</button>'+

     '<img src="'+
     image(p[1])+
     '" alt="" draggable="false">'+

     '<div class="slotName">'+
     p[0]+
     '</div>';


    const removeBtn=
     slot.querySelector(".remove");


    removeBtn.addEventListener(
     "pointerup",
     function(e){

      e.preventDefault();
      e.stopPropagation();

      remove(mode,i);

     },
     {passive:false}
    );

   }

  }else{

   slot.innerHTML=

    '<div class="empty">'+
    (i+1)+
    '体目<br>'+
    '検索して追加'+
    '</div>';

  }


  grid.appendChild(slot);

 }

}


/* =====================================================
   全表示
   ===================================================== */

function render(){

 drawTeam(

 drawTeam(
  mySel,

/* =====================================================
   タイプ相性
   ===================================================== */

const SUPER={

"ほのお":
 ["くさ","こおり","むし","はがね"],

"みず":
 ["ほのお","じめん","いわ"],

"でんき":
 ["みず","ひこう"],

"くさ":
 ["みず","じめん","いわ"],

"こおり":
 ["くさ","じめん","ひこう","ドラゴン"],

"かくとう":
 ["ノーマル","こおり","いわ","あく","はがね"],

"どく":
 ["くさ","フェアリー"],

"じめん":
 ["ほのお","でんき","どく","いわ","はがね"],

"ひこう":
 ["くさ","かくとう","むし"],

"エスパー":
 ["かくとう","どく"],

"むし":
 ["くさ","エスパー","あく"],

"いわ":
 ["ほのお","こおり","ひこう","むし"],

"ゴースト":
 ["エスパー","ゴースト"],

"ドラゴン":
 ["ドラゴン"],

"あく":
 ["エスパー","ゴースト"],

"フェアリー":
 ["かくとう","ドラゴン","あく"],

"はがね":
 ["こおり","いわ","フェアリー"]

};


function effectiveness(
 attacker,
 enemy
){

 let score=1;


 const types=
  [enemy[2],enemy[3]]
  .filter(Boolean);


 types.forEach(type=>{

  if(
   SUPER[attacker] &&
   SUPER[attacker].includes(type)
  ){

   score*=2;

  }

 });


 return score;

}


/* =====================================================
   選出判定
   ===================================================== */

function judge(){

 const result=
  document.getElementById("result");


 if(mySel.length<6){

  result.innerHTML=
   "⚠️ 自分の6体を登録してください。";

  return;

 }


 if(oppSel.length<6){

  result.innerHTML=
   "⚠️ 相手の6体を登録してください。";

  return;

 }


 const scores=
  mySel.map(name=>{

   const p=
    P.find(
     x=>x[0]===name
    );


   let score=50;


   oppSel.forEach(enemyName=>{

    const enemy=
     P.find(
      x=>x[0]===enemyName
     );


    if(!enemy){
     return;
    }


    let best=1;


    if(p[2]){

     best=Math.max(
      best,
      effectiveness(
       p[2],
       enemy
      )
     );

    }


    if(p[3]){

     best=Math.max(
      best,
      effectiveness(
       p[3],
       enemy
      )
     );

    }


    if(best>=4){

     score+=20;

    }else if(best>=2){

     score+=10;

    }else{

     score+=2;

    }

   });


   return{
    name:name,
    score:score
   };

  });


 scores.sort(
  (a,b)=>b.score-a.score
 );


 const best=
  scores.slice(0,3);


 result.innerHTML=

  '<div class="resultTitle">'+
  '🏆 おすすめ3体'+
  '</div>'+

  '<div class="resultTeam">'+

  best.map(x=>{

   const p=
    P.find(
     y=>y[0]===x.name
    );


   return

    '<div class="resultCard">'+

    '<img src="'+
    image(p[1])+
    '" alt="">'+

    '<div>'+
    p[0]+
    '</div>'+

    '</div>';

  }).join("")+

  '</div>'+

  '<div class="rank">'+

  scores.map(
   (x,i)=>
    (i+1)+
    "位　"+
    x.name+
    "　評価 "+
    x.score
  ).join("<br>")+

  '</div>';

}
