/* =========================================================
   CSVパーサー
========================================================= */

function parseCSVLine(line){

  const result=[];

  let current="";
  let quote=false;

  for(let i=0;i<line.length;i++){

    const c=line[i];

    if(c==='"'){

      if(
        quote &&
        line[i+1]==='"'
      ){

        current+='"';
        i++;

      }else{

        quote=!quote;

      }

    }else if(
      c==="," &&
      !quote
    ){

      result.push(current);
      current="";

    }else{

      current+=c;

    }

  }

  result.push(current);

  return result;

}


function parseCSV(text){

  const lines=
    text
      .replace(/^\uFEFF/,"")
      .split(/\r?\n/);

  return lines
    .slice(1)
    .filter(Boolean)
    .map(parseCSVLine);

}

========================================================= */

async function getText(url){

  const response=
    await fetch(
      url,
      {
        cache:"force-cache"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP "+response.status
    );

  }

  return response.text();

}


/* =========================================================
   全ポケモンDB
========================================================= */

async function loadDatabase(){

  if(
    loading ||
    databaseReady
  )
    return;

  loading=true;

  setStatus(
    "oppStatus",
    "全ポケモンデータを読み込み中…"
  );

  setStatus(
    "myStatus",
    "全ポケモンデータを読み込み中…"
  );

  try{

    const[
      speciesText,
      pokemonText,
      typesText
    ]=
    await Promise.all([

      getText(
        SPECIES_NAMES_URL
      ),

      getText(
        POKEMON_URL
      ),

      getText(
        TYPES_URL
      )

    ]);


    /* 日本語名 */

    const names={};

    parseCSV(
      speciesText
    ).forEach(row=>{

      const speciesId=
        Number(row[1]);

      const languageId=
        Number(row[2]);

      const name=
        row[3];

      /*
        language_id 11 = Japanese
      */

      if(
        languageId===11 &&
        name
      ){

        names[speciesId]=name;

      }

    });


    /* 英語名 */

    const english={};

    parseCSV(
      pokemonText
    ).forEach(row=>{

      const id=
        Number(row[0]);

      const identifier=
        row[1];

      const speciesId=
        Number(row[2]);

      /*
        通常フォームを優先
      */

      if(
        id===speciesId &&
        identifier
      ){

        english[id]=identifier;

      }

    });


    /* タイプ */

    const types={};

    parseCSV(
      typesText
    ).forEach(row=>{

      const pokemonId=
        Number(row[0]);

      const slot=
        Number(row[1]);

      const typeId=
        Number(row[2]);

      if(!types[pokemonId])
        types[pokemonId]=[];

      types[pokemonId][slot-1]
        =
        typeJP[typeId]||"";

    });


    database=
      Object.keys(english)
      .map(id=>{

        const number=
          Number(id);

        return{

          id:number,

          en:
            english[number],

          ja:
            names[number]||
            english[number],

          types:
            (types[number]||[])
            .filter(Boolean)

        };

      })
      .filter(
        x=>x.ja
      );


    databaseReady=true;

    setStatus(
      "oppStatus",
      "全"+database.length+
      "種類を検索できます"
    );

    setStatus(
      "myStatus",
      "全"+database.length+
      "種類を検索できます"
    );


    renderAll();


  }catch(error){

    console.error(error);

    /*
      通信に失敗しても
      使用率上位は操作できるようにする
    */

    database=
      priority
      .map(
        (name,index)=>({

          id:
            priorityIds[name]||
            index+1,

          en:name,

          ja:name,

          types:
            knownTypes[name]||
            []

        })
      );

    databaseReady=true;

    setStatus(
      "oppStatus",
      "主要ポケモンで動作中"
    );

    setStatus(
      "myStatus",
      "主要ポケモンで動作中"
    );

    renderAll();

  }

  loading=false;

}

/* =========================================================
   正規化
========================================================= */

function normalize(text){

  return String(text||"")
    .toLowerCase()
    .replace(
      /[ 　・ー‐-]/g,
      ""
    );

}


/* =========================================================
   検索
========================================================= */

function findPokemon(name){

  const n=
    normalize(name);

  return database.find(
    p=>
      normalize(p.ja)===n
  )
  ||
  database.find(
    p=>
      normalize(p.en)===n
  )
  ||
  database.find(
    p=>
      normalize(p.ja).includes(n)
  );

}


function searchPokemon(query){

  const q=
    normalize(query);

  if(!q)
    return[];


  /* 略称 */

  if(aliases[q]){

    const aliasName=
      aliases[q];

    const item=
      findPokemon(
        aliasName
      );

    if(item)
      return[item];

  }


  return database
    .filter(item=>{

      const ja=
        normalize(item.ja);

      const en=
        normalize(item.en);

      return(
        ja.includes(q)||
        en.includes(q)
      );

    })
    .sort(
      (a,b)=>{

        const pa=
          priority.indexOf(
            a.ja
          );

        const pb=
          priority.indexOf(
            b.ja
          );

        return(
          (pa<0?9999:pa)-
          (pb<0?9999:pb)
        );

      }
    )
    .slice(0,15);

}

    ART_BASE+
    "/"+
    id+
    ".png";


  /*
    取得できなければ通常sprite
  */

  img.onerror=()=>{

    if(
      !img.dataset.fallback
    ){

      img.dataset.fallback="1";

      img.src=
        IMAGE_BASE+
        "/"+
        id+
        ".png";

    }else{

      img.style.visibility=
        "hidden";

    }

  };


  return img;

}

function renderSelected(
  list,
  targetId,
  isMine
){

  const target=
    document.getElementById(
      targetId

  if(!target)
    return;

  target.innerHTML="";


  for(
    let i=0;
    i<6;
    i++

        "div"

    slot.className=
      "slot";


    if(list[i]){

      const item=
        findPokemon(
          list[i]
        );


      if(item){

          createImage(
            item.id,
            item.ja

      name.className=

function selectPokemon(
  item,
  list,
  inputId,
  suggestionId,
  isMine
){

  const name=
    item.ja||
    item.en;


  if(
    list.includes(name)
  )
    return;


  if(
    list.length>=MAX_TEAM
  ){

    alert(
      "6体まで選択できます。"
    );

    return;

  }


  if(isMine){

    mine.push(name);

  }else{

    opponent.push(name);

  }


  save();


  document.getElementById(
    inputId
  ).value="";


  document.getElementById(
    suggestionId
  ).innerHTML="";


  renderAll();

}


/* =========================================================
   検索結果
========================================================= */

let searchTimers={};


function renderSearch(
  inputId,
  suggestionId,
  list,
  isMine
){

  const input=
    document.getElementById(
      inputId
    );

  const box=
    document.getElementById(
      suggestionId
    );

  const status=
    document.getElementById(
      isMine?
      "myStatus":
      "oppStatus"
    );


  if(!input||!box)
    return;


  const raw=
    input.value.trim();

  const results=
    searchPokemon(raw);


  box.innerHTML="";


  if(!raw){

    status.textContent=
      "ポケモン名を入力してください";

    return;

  }


  if(!results.length){

    status.textContent=
      "見つかりませんでした";

    return;

  }


  status.textContent=
    results.length+
    "件見つかりました";


  results.forEach(
    item=>{

      const name=
        item.ja||
        item.en;


      if(
        list.includes(name)
      )
        return;


      const button=
        document.createElement(
          "button"
        );

      button.type=
        "button";

      button.className=
        "suggestion";


      button.appendChild(
        createImage(
          item.id,
          name
        )
      );


      const main=
        document.createElement(
          "div"
        );

      main.className=
        "suggestion-main";


      const title=
        document.createElement(
          "div"
        );

      title.textContent=
        name;


      const sub=
        document.createElement(
          "div"
        );

      sub.className=
        "suggestion-type";

      sub.textContent=
        item.en+
        (
          item.types.length
          ?"　"+
           item.types.join(" / ")
          :""
        );


      main.appendChild(
        title
      );

      main.appendChild(
        sub
      );


      button.appendChild(
        main
      );


      button.onclick=
        ()=>{

          selectPokemon(
            item,
            list,
            inputId,
            suggestionId,
            isMine
          );

        };


      box.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   検索イベント
========================================================= */

function setupSearch(
  inputId,
  suggestionId,
  list,
  isMine
){

  const input=
    document.getElementById(
      inputId
    );


  input.addEventListener(
    "input",
    ()=>{

      clearTimeout(
        searchTimers[inputId]
      );


      searchTimers[inputId]=
        setTimeout(
          ()=>{

            renderSearch(
              inputId,
              suggestionId,
              list,
              isMine
            );

          },
          80
        );

    }
  );

}

function safeLoad(key){

  try{

    const data=
      JSON.parse(
        localStorage.getItem(
          key
        )||"[]"
      );


    if(
      !Array.isArray(data)
    )
      return[];


    return data.slice(
      0,
      MAX_TEAM
    );


  }catch(e){

    return[];

  }

}

}

/* =========================================================
   攻撃相性
========================================================= */

function typeMultiplier(
  attackType,
  defenseTypes
){

  let value=1;


  defenseTypes.forEach(
    defenseType=>{

      if(
        effectiveness[attackType] &&
        effectiveness[attackType]
          [defenseType]!==undefined
      ){

        value*=
          effectiveness
            [attackType]
            [defenseType];

      }

    }
  );


  return value;

}


function bestAttack(
  attacker,
  defender
){

  const attackTypes=
    knownTypes[
      attacker.ja
    ]||
    attacker.types||
    [];


  const defenseTypes=
    knownTypes[
      defender.ja
    ]||
    defender.types||
    [];


  if(
    !attackTypes.length||
    !defenseTypes.length
  )
    return 1;


  return Math.max(
    ...attackTypes.map(
      type=>
        typeMultiplier(
          type,
          defenseTypes
        )
    )
  );

}


function bestDefense(
  attacker,
  defender
){

  const attackTypes=
    knownTypes[
      attacker.ja
    ]||
    attacker.types||
    [];


  const defenseTypes=
    knownTypes[
      defender.ja
    ]||
    defender.types||
    [];


  if(
    !attackTypes.length||
    !defenseTypes.length
  )
    return 1;


  return Math.min(
    ...attackTypes.map(
      type=>
        typeMultiplier(
          type,
          defenseTypes
        )
    )
  );

}


/* =========================================================
   個別評価
========================================================= */

function evaluatePokemon(
  pokemon,
  enemies
){

  let score=0;
  let advantage=0;
  let immune=0;


  enemies.forEach(
    enemy=>{

      const offense=
        bestAttack(
          pokemon,
          enemy
        );


      const defense=
        bestDefense(
          enemy,
          pokemon
        );


      if(
        offense>=4
      ){

        score+=8;
        advantage++;

      }else if(
        offense>=2
      ){

        score+=5;
        advantage++;

      }else if(
        offense>1
      ){

        score+=3;

      }else if(
        offense===1
      ){

        score+=1;

      }else{

        score-=2;

      }


      if(
        defense===0
      ){

        score+=5;
        immune++;

      }else if(
        defense<=.5
      ){

        score+=3;

      }else if(
        defense>=4
      ){

        score-=5;

      }else if(
        defense>=2
      ){

        score-=3;

      }

    }
  );


  const environment=
    usageData[
      pokemon.ja
    ];


  if(environment){

    score+=
      Math.max(
        0,
        20-
        environment.rank
      )*.15;

  }


  return{

    pokemon,
    score,
    advantage,
    immune

  };

}


/* =========================================================
   組み合わせ
========================================================= */

function combinations(
  array
){

  const result=[];


  for(
    let i=0;
    i<array.length;
    i++
  ){

    for(
      let j=i+1;
      j<array.length;
      j++
    ){

      for(
        let k=j+1;
        k<array.length;
        k++
      ){

        result.push([
          array[i],
          array[j],
          array[k]
        ]);

      }

    }

  }


  return result;

}


/* =========================================================
   チーム評価
========================================================= */

function evaluateTeam(
  team,
  enemies
){

  let score=0;


  team.forEach(
    pokemon=>{

      score+=
        evaluatePokemon(
          pokemon,
          enemies
        ).score;

    }
  );


  /*
    3体のタイプ補完
  */

  for(
    let i=0;
    i<team.length;
    i++
  ){

    for(
      let j=i+1;
      j<team.length;
      j++
    ){

      const first=
        knownTypes[
          team[i].ja
        ]||
        team[i].types||
        [];


      const second=
        knownTypes[
          team[j].ja
        ]||
        team[j].types||
        [];


      if(
        first.some(
          x=>
            !second.includes(x)
        )
      ){

        score+=.5;

      }

    }

  }


  return score;

}

      </h3>

      </div>

  const enemies=
    opponent

    .filter(Boolean);

    mine
    .map(findPokemon)
    .filter(Boolean);


  if(
    enemies.length<6||
