<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">

<title>Pokémon Champions 選出アシスタント</title>

<style>
:root{
  --bg:#0b1020;
  --panel:#141b2d;
  --panel2:#1b243b;
  --text:#f4f7ff;
  --muted:#aab4ca;
  --accent:#62d9ff;
  --good:#62e6a7;
  --bad:#ff7185;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:linear-gradient(160deg,#09101d,#111a30);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

header{
  padding:18px 16px 12px;
  position:sticky;
  top:0;
  background:rgba(9,16,29,.95);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  z-index:100;
  border-bottom:1px solid #26304a;
}

h1{
  font-size:20px;
  margin:0 0 5px;
}

h2{
  font-size:16px;
  margin:0 0 10px;
}

h3{
  margin:0;
}

.sub{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
}

main{
  max-width:1050px;
  margin:auto;
  padding:14px;
}

.panel{
  background:rgba(20,27,45,.96);
  border:1px solid #293551;
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 8px 30px #0004;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

input,
button,
select{
  font:inherit;
}

input,
select{
  flex:1;
  min-width:180px;
  background:#0d1527;
  border:1px solid #33415f;
  color:white;
  border-radius:12px;
  padding:11px;
}

input::placeholder{
  color:#7f8ba5;
}

input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 2px #62d9ff22;
}

select{
  background:#0d1527;
  color:white;
}

button{
  border:0;
  border-radius:12px;
  padding:10px 13px;
  background:#263653;
  color:white;
  font-weight:700;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

button.primary{
  background:linear-gradient(135deg,#1c9fcb,#5967ff);
}

button.danger{
  background:#512535;
}

/* =========================
   検索エリア
========================= */

.searchWrap{
  position:relative;
  flex:1;
  min-width:220px;
  z-index:50;
}

.searchWrap input{
  width:100%;
  min-width:0;
}

/* 予測変換 */

.suggestions{
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 5px);
  background:#111a2c;
  border:1px solid #3c4c70;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 14px 35px #0009;
  display:none;
  max-height:310px;
  overflow-y:auto;
  z-index:200;
}

.suggestions.show{
  display:block;
}

.suggestion{
  width:100%;
  min-height:60px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 10px;
  background:#111a2c;
  border:0;
  border-bottom:1px solid #263451;
  border-radius:0;
  text-align:left;
  color:white;
}

.suggestion:last-child{
  border-bottom:0;
}

.suggestion:active{
  background:#20385c;
}

.suggestion img{
  width:44px;
  height:44px;
  object-fit:contain;
  flex:0 0 44px;
}

.suggestionText{
  min-width:0;
}

.suggestionName{
  font-size:13px;
  font-weight:800;
}

.suggestionType{
  font-size:10px;
  color:var(--muted);
  margin-top:2px;
}

.suggestionRank{
  margin-left:auto;
  font-size:9px;
  color:#91a5c9;
  white-space:nowrap;
}

/* =========================
   6体スロット
========================= */

.slots{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:7px;
  margin:10px 0;
}

.slot{
  min-height:70px;
  border:1px dashed #42506e;
  border-radius:12px;
  padding:5px;
  text-align:center;
  color:var(--muted);
  font-size:10px;
  overflow:hidden;
}

.slot img{
  width:48px;
  height:48px;
  display:block;
  margin:auto;
  object-fit:contain;
}

.slot.selected{
  border-style:solid;
  border-color:var(--accent);
  background:#162942;
}

.slotName{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================
   ポケモン一覧
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  max-height:440px;
  overflow:auto;
  padding-right:2px;
  margin-top:9px;
}

.card{
  background:#111a2c;
  border:1px solid #2c3956;
  border-radius:13px;
  padding:7px;
  text-align:center;
  position:relative;
  cursor:pointer;
  transition:.12s;
}

.card:active{
  transform:scale(.96);
}

.card:hover{
  border-color:#5a6e9c;
}

.card img{
  width:68px;
  height:68px;
  object-fit:contain;
}

.name{
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.type{
  font-size:9px;
  color:#9eacc6;
  margin-top:2px;
}

.rank{
  position:absolute;
  left:5px;
  top:5px;
  background:#0009;
  border-radius:7px;
  padding:2px 5px;
  font-size:9
