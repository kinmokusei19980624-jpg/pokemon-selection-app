<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>ポケモン選出アシスタント</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#eef2f7;
color:#0f172a;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif
}
header{
background:#0f172a;
color:white;
padding:14px 16px;
position:sticky;
top:0;
z-index:10
}
header h1{
font-size:19px;
margin:0 0 3px
}
header p{
font-size:11px;
margin:0;
color:#cbd5e1
}
main{
max-width:760px;
margin:auto;
padding:12px 12px 40px
}
.card{
background:white;
border-radius:16px;
padding:14px;
margin-bottom:12px;
box-shadow:0 2px 10px #0000000c
}
h2{
font-size:16px;
margin:0 0 10px
}
.small{
font-size:11px;
color:#64748b;
line-height:1.5
}
button{
border:0;
border-radius:12px;
padding:11px 14px;
font-size:14px;
font-weight:700;
background:#2563eb;
color:white;
touch-action:manipulation
}
button.gray{
background:#e2e8f0;
color:#0f172a
}
.actions{
display:flex;
gap:8px;
flex-wrap:wrap
}
.team{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px
}
.slot{
min-height:94px;
border:1px dashed #cbd5e1;
border-radius:12px;
background:#f8fafc;
text-align:center;
padding:5px
}
.slot img{
width:58px;
height:58px;
object-fit:contain;
display:block;
margin:auto
}
.slot .nm{
font-size:11px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}
.empty{
padding-top:31px;
color:#94a3b8;
font-size:11px
}
input{
width:100%;
padding:12px;
border:1px solid #cbd5e1;
border-radius:11px;
font-size:15px;
outline:none
}
.filters{
display:flex;
gap:7px;
margin:8px 0;
overflow:auto
}
.filters button{
white-space:nowrap;
padding:8px 10px;
font-size:12px
}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px
}
.poke{
display:flex;
align-items:center;
gap:7px;
text-align:left;
width:100%;
min-height:76px;
background:white;
color:#0f172a;
border:1px solid #e2e8f0;
padding:6px
}
.poke img{
width:54px;
height:54px;
object-fit:contain;
flex:0 0 54px
}
.poke .nm{
font-size:12px;
font-weight:800
}
.poke .type{
font-size:10px;
color:#64748b
}
.poke .rank{
display:inline-block;
font-size:9px;
background:#eef2ff;
color:#3730a3;
border-radius:6px;
padding:2px 5px;
margin-top:4px
}
.poke.selected{
border:2px solid #2563eb;
background:#eff6ff
}
.mode{
margin-bottom:10px;
padding:9px 10px;
border-radius:10px;
background:#eff6ff;
color:#1d4ed8;
font-size:12px;
font-weight:700
}
.result{
background:#0f172a;
color:white;
border-radius:15px;
padding:14px
}
.resultrow{
display:flex;
justify-content:space-between;
padding:9px 0;
border-bottom:1px solid #ffffff20
}
.score{
font-weight:800
}
.notice{
margin-top:10px;
background:#fff7ed;
color:#9a3412;
border-radius:10px;
padding:9px;
font-size:11px;
line-height:1.5
}
.count{
font-size:11px;
color:#64748b;
margin:8px 0
}
.hidden{
display:none!important
}
@media(min-width:600px){
.grid{
grid-template-columns:repeat(3,1fr)
}
}
</style>
</head>
<body>
<header>
<h1>⚔️ ポケモン選出アシスタント</h1>
<p>自分の6体を保存 → 相手6体を選択 → 推奨3体を判定</p>
</header>
<main>
<section class="card">
<h2>① 自分の6体（固定）</h2>
<div id="myTeam" class="team"></div>
<div class="actions" style="margin-top:10px">
<button id="editMine">6体を設定・変更</button>
<button id="clearMine" class="gray">全消去</button>
</div>
<p class="small">
設定した6体はこのSafariに保存されます。<br>
変更するまで毎回選び直す必要はありません。
</p>
</section>
<section class="card">
<h2>② 相手の6体</h2>
<div id="modeText" class="mode">
現在：相手のポケモンを選択
</div>
<input
id="search"
type="search"
placeholder="ポケモン名で検索"
>
<div class="filters">
<button id="usageBtn" class="gray">使用率順</button>
<button id="nameBtn" class="gray">名前順</button>
</div>
<div id="count" class="count"></div>
<div id="enemyTeam" class="team" style="margin-bottom:10px"></div>
<div id="picker" class="grid"></div>
</section>
<section class="card">
<button id="judge" style="width:100%;font-size:16px">
🔥 最適選出を判定
</button>
<div id="result" class="result hidden" style="margin-top:12px"></div>
</section>
</main>

return String(s).replace(
/[&<>"']/g,

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[c];
});

my.innerHTML="";
for(let i=0;i<6;i++){
const name=mine[i];
const p=get(name);
if(p){
my.innerHTML+=
'<div class="slot">'+
'<img src="'+sprite(p)+'">'+
'<div class="nm">'+
esc(name)+
'</div>'+
'</div>';
}else{
my.innerHTML+=
'<div class="slot">'+
'<div class="empty">'+
(i+1)+"体目"+
'</div>'+
'</div>';
}
}
const en=
document.getElementById("enemyTeam");
en.innerHTML="";
for(let i=0;i<6;i++){
const name=enemy[i];
const p=get(name);
if(p){
en.innerHTML+=
'<div class="slot">'+
'<img src="'+sprite(p)+'">'+
'<div class="nm">'+
esc(name)+
'</div>'+
'</div>';
}else{
en.innerHTML+=
'<div class="slot">'+
'<div class="empty">相手 '+(i+1)+'</div>'+
'</div>';
}
}
}
/*
========================================
モード表示
========================================
*/
function renderMode(){
document.getElementById("modeText").textContent=
mode==="mine"
?"現在：自分の6体を設定・変更"
:"現在：相手の6体を選択";
}
/*
========================================
候補一覧
========================================
*/
function renderPicker(){
const input=
document.getElementById("search");
const q=
input.value
.trim()
.toLowerCase();
let list=uniqueP.filter(
p=>p[0].toLowerCase().includes(q)
);
/*
使用率順
*/
if(sortMode==="usage"){
list.sort(
(a,b)=>b[3]-a[3]
);
}
/*
名前順
*/
else{
list.sort(
(a,b)=>a[0].localeCompare(b[0],"ja")
);
}
/*
現在の対象
*/
const target=
mode==="mine"
?mine
:enemy;
/*
候補数表示
*/
document.getElementById("count").textContent=
"選択候補："+list.length+"体　｜　"+
"選択中："+target.length+"/6体";
document.getElementById("picker").innerHTML=
list.map(p=>{
const selected=
target.includes(p[0]);
return `
<button
type="button"
class="poke ${selected?"selected":""}"
data-name="${esc(p[0])}"
>
<img
src="${sprite(p)}"
alt="${esc(p[0])}"
>
<span>
<span class="nm">
${esc(p[0])}
</span>
<br>
<span class="type">
${esc(p[1])}
</span>
<br>
<span class="rank">
使用率目安 ${p[3]}
</span>
</span>
</button>
`;
}).join("");
}
/*
========================================
ポケモン選択
========================================
*/
function selectPokemon(name){
let target=
mode==="mine"
?mine
:enemy;
/*
すでに選択されている場合
*/
const index=
target.indexOf(name);
if(index!==-1){
target.splice(index,1);
}
/*
新規選択
*/
else{
if(target.length>=6){
alert("最大6体まで選択できます。");
return;
}
target.push(name);
}
/*
自分の6体なら保存
*/
if(mode==="mine"){
localStorage.setItem(
"champions_mine",
JSON.stringify(mine)
);
}
/*
再描画
*/
renderTeams();
renderPicker();
/*
自分6体完成
*/
if(
mode==="mine" &&
mine.length===6
){
mode="enemy";
document.getElementById("search").value="";
renderMode();
renderPicker();
}
}
/*
========================================
タイプ分割
========================================
*/
function typeParts(type){
return type
.split(" / ")
.map(x=>x.trim());
}
/*
========================================
簡易タイプ相性
========================================
*/
function matchup(att,def){
const a=
typeParts(att);
const d=
typeParts(def);
let score=0;
a.forEach(x=>{
d.forEach(y=>{
if(
(TYPES[x]||[]).includes(y)
){
score+=2;
}
});
});
return score;
}
/*
========================================
選出判定
========================================
*/
function judge(){
if(mine.length!==6){
alert("自分の6体を設定してください。");
return;
}
if(enemy.length!==6){
alert("相手の6体を選択してください。");
return;
}
const ranked=
mine.map(name=>{
const p=get(name);
let score=p[3]/10;
/*
相手6体とのタイプ相性
*/
enemy.forEach(enemyName=>{
const ep=get(enemyName);
if(ep){
score+=matchup(
p[1],
ep[1]
);
}
});
return{
name:name,
score:score
};
}).sort(
(a,b)=>b.score-a.score
);
const result=
document.getElementById("result");
result.classList.remove("hidden");
result.innerHTML=
"<h2>🏆 推奨選出</h2>"+
ranked
.slice(0,3)
.map((x,i)=>`
<div class="resultrow">
<span>
${i+1}位　
<b>${esc(x.name)}</b>
</span>
<span class="score">
${x.score.toFixed(1)}
</span>
</div>
`)
.join("")+
`
<div class="notice">
タイプ相性と使用率目安による簡易判定です。
実際の対戦では技・特性・持ち物・テラスタル・メガシンカ・素早さ関係なども影響します。
</div>
`;
}
/*
========================================
自分6体変更
========================================
*/
document
.getElementById("editMine")
.addEventListener(
"click",
function(){
mode="mine";
document.getElementById("search").value="";
renderMode();
renderPicker();
document
.getElementById("picker")
.scrollIntoView({
behavior:"smooth",
block:"start"
});
}
);
/*
========================================
全消去
========================================
*/
document
.getElementById("clearMine")
.addEventListener(
"click",
function(){
if(
confirm("自分の6体を全部消しますか？")
){
mine=[];
enemy=[];
localStorage.removeItem(
"champions_mine"
);
mode="mine";
document
.getElementById("result")
.classList.add("hidden");
renderTeams();
renderMode();
renderPicker();
}
}
);
/*
========================================
検索
========================================
*/
document
.getElementById("search")
.addEventListener(
"input",
renderPicker
);
/*
========================================
使用率順
========================================
*/
document
.getElementById("usageBtn")
.addEventListener(
"click",
function(){
sortMode="usage";
renderPicker();
}
);
/*
========================================
名前順
========================================
*/
document
.getElementById("nameBtn")
.addEventListener(
"click",
function(){
sortMode="name";
renderPicker();
}
);
/*
========================================
判定
========================================
*/
document
.getElementById("judge")
.addEventListener(
"click",
judge
);
/*
========================================
相手6体エリア
========================================
*/
document
.getElementById("enemyTeam")
.addEventListener(
"click",
function(){
mode="enemy";
renderMode();
renderPicker();
}
);
/*
========================================
候補ポケモンタップ
========================================
*/
document
.getElementById("picker")
.addEventListener(
"click",
function(event){
const button=
event.target.closest(
"button[data-name]"
);
if(!button)return;
selectPokemon(
button.dataset.name
);
}
);
/*
========================================
初期表示
========================================
*/
renderTeams();
renderMode();
renderPicker();
})();
</script>
</body>
</html>
