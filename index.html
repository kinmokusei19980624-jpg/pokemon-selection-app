<style>

.section{

.section-title{

.search{
  width:100%;

  border:1px solid #475569;

  padding:0 13px;

.search::placeholder{

.suggestion{

  border-radius:11px;

}

.suggestion-type{

.selected-area{
  display:grid;

  margin-top:10px;

  min-height:70px;
  border:1px dashed #475569;

  justify-content:center;
  align-items:center;

  font-size:9px;

.slot img{

}

  border:1px solid #334155;

<script>

/* =========================================================
   基本設定
========================================================= */

const API_BASE="https://pokeapi.co/api/v2";

const IMAGE_BASE=
"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon";

const MAX_TEAM=6;

let database=[];
let databaseReady=false;
let loading=false;


/* =========================================================
   保存データ
========================================================= */

let opponent=[];
let mine=[];

function safeLoad(key){

  try{

    const value=
      JSON.parse(localStorage.getItem(key)||"[]");

    if(!Array.isArray(value)) return [];

    return value.slice(0,MAX_TEAM);

  }catch(e){

    try{
      localStorage.removeItem(key);
    }catch(_){}

    return [];

  }

}

opponent=safeLoad("pokemon_opp");
mine=safeLoad("pokemon_my");


function save(){

  try{

    localStorage.setItem(
      "pokemon_opp",
      JSON.stringify(opponent)
    );

    localStorage.setItem(
      "pokemon_my",
      JSON.stringify(mine)
    );

  }catch(e){

    /* 保存失敗してもアプリは継続 */

  }

}


/* =========================================================
   簡易環境優先順位
========================================================= */

const priority=[
"ガブリアス",
"カイリュー",
"サーフゴー",
"ミミッキュ",
"マスカーニャ",
"ブリジュラス",
"アシレーヌ",

"アーマーガア"

/* =========================================================
   日本語検索補助
========================================================= */

const aliases={

"かい":"カイリュー",
"かいりゅう":"カイリュー",

"がぶ":"ガブリアス",
"がぶりあす":"ガブリアス",

"さーふ":"サーフゴー",
"さーふごー":"サーフゴー",

"みみ":"ミミッキュ",

"ます":"マスカーニャ",

"ぶり":"ブリジュラス",

"あし":"アシレーヌ",

"りざ":"リザードン",

"らぐ":"ラグラージ",

"ぎる":"ギルガルド",

"ぺり":"ペリッパー",

"いだ":"イダイトウ",

"ばしゃ":"バシャーモ",

"きら":"キラフロル",

"げん":"ゲンガー",

"かば":"カバルドン",

"どど":"ドドゲザン",

"ぺん":"ペンドラー",

"える":"エルフーン",

"やみ":"ヤミラミ"

};


/* =========================================================
   正規化
========================================================= */

function normalize(text){

  return String(text||"")
    .toLowerCase()
    .replace(/[ 　]/g,"")
    .replace(/ー/g,"");

}


/* =========================================================
   日本語名取得
========================================================= */

async function getJapaneseName(url){

  try{

    const response=
      await fetch(url,{cache:"force-cache"});

    if(!response.ok)
      return null;

    const data=
      await response.json();

    const ja=
      data.names?.find(
        x=>x.language?.name==="ja"
      );

    return ja?.name||null;

  }catch(e){

    return null;

  }

}


/* =========================================================
   全ポケモン基本データ取得
========================================================= */

async function loadDatabase(){

  if(databaseReady || loading)
    return;

  loading=true;

  setStatus(
    "oppStatus",
    "全種類の検索データを準備中…"
  );

  setStatus(
    "myStatus",
    "全種類の検索データを準備中…"
  );

  try{

    const response=
      await fetch(
        API_BASE+"/pokemon-species?limit=2000",
        {cache:"force-cache"}
      );

    if(!response.ok)
      throw new Error("database");

    const data=
      await response.json();

    database=
      data.results.map((x,index)=>({

        id:index+1,
        en:x.name,
        ja:null,
        url:x.url

      }));

    databaseReady=true;

    setStatus(
      "oppStatus",
      "検索準備完了"
    );

    setStatus(
      "myStatus",
      "検索準備完了"
    );

  }catch(e){

    database=[];

    setStatus(
      "oppStatus",
      "通信できません。名前を入力して再試行してください。"
    );

    setStatus(
      "myStatus",
      "通信できません。名前を入力して再試行してください。"
    );

  }finally{

    loading=false;

  }

}


/* =========================================================
   ステータス表示
========================================================= */

function setStatus(id,text){

  const el=
    document.getElementById(id);

  if(el)
    el.textContent=text;

}


/* =========================================================
   優先順位
========================================================= */

function priorityScore(name){

  const i=
    priority.indexOf(name);

  if(i<0)
    return 9999;

  return i;

}


/* =========================================================
   検索
========================================================= */

let searchTimer=null;

async function searchPokemon(query){

  const q=
    normalize(query);

  if(!q)
    return [];

  /* まず既知の別名 */

  const alias=
    aliases[q];

  if(alias){

    const item=
      database.find(x=>x.ja===alias);

    if(item)
      return [item];

  }


  /* 日本語名がまだないため、
     検索対象を限定して名前を取得 */

  const candidates=
    database.filter(x=>
      normalize(x.en).includes(q)
    ).slice(0,15);


  /* 日本語名を少数だけ取得 */

  await Promise.all(

    candidates.map(async item=>{

      if(item.ja!==null)
        return;

      item.ja=
        await getJapaneseName(item.url);

    })

  );


  return database
    .filter(item=>{

      const ja=
        normalize(item.ja);

      const en=
        normalize(item.en);

      return(
        ja.includes(q) ||
        en.includes(q)
      );

    })
    .sort((a,b)=>{

      return priorityScore(a.ja||"")
           - priorityScore(b.ja||"");

    })
    .slice(0,12);

}


/* =========================================================
   画像
========================================================= */

function imageURL(id){

  return IMAGE_BASE+"/"+id+".png";

}


/* =========================================================
   画像安全読み込み
========================================================= */

function safeImage(id,name){

  const img=
    document.createElement("img");

  img.width=42;
  img.height=42;
  img.alt=name||"";

  img.loading="lazy";
  img.decoding="async";

  img.src=imageURL(id);

  img.onerror=()=>{

    img.removeAttribute("src");

  };

  return img;

}


/* =========================================================
   選択済み表示
========================================================= */

function renderSelected(list,targetId){

  const target=
    document.getElementById(targetId);

  if(!target)
    return;

  target.innerHTML="";

  for(let i=0;i<6;i++){

    const slot=
      document.createElement("div");

    slot.className="slot";

    if(list[i]){

      const item=
        database.find(
          x=>x.ja===list[i] ||
             x.en===list[i]
        );

      if(item){

        slot.appendChild(
          safeImage(
            item.id,
            item.ja||item.en
          )
        );

      }

      const name=
        document.createElement("div");

      name.className="slot-name";
      name.textContent=list[i];

      slot.appendChild(name);

    }else{

      slot.textContent="空き";

    }

    target.appendChild(slot);

  }

}


/* =========================================================
   ポケモン選択
========================================================= */

function selectPokemon(item,list,inputId,suggestionId){

  const name=
    item.ja||item.en;

  if(list.includes(name))
    return;

  if(list.length>=MAX_TEAM){

    alert("6体まで選択できます。");

    return;

  }

  list.push(name);

  save();

  const input=
    document.getElementById(inputId);

  if(input)
    input.value="";

  const box=
    document.getElementById(suggestionId);

  if(box)
    box.innerHTML="";

  renderSelected(
    list,
    list===mine
      ?"mySelected"
      :"oppSelected"
  );

  updateCounts();

}


/* =========================================================
   検索結果表示
========================================================= */

async function renderSearch(
  inputId,
  suggestionId,
  list
){

  const input=
    document.getElementById(inputId);

  const box=
    document.getElementById(suggestionId);

  if(!input || !box)
    return;

  const query=
    input.value.trim();

  box.innerHTML="";

  if(!query){

    setStatus(
      list===mine
        ?"myStatus"
        :"oppStatus",
      "ポケモン名を入力してください"
    );

    return;

  }

  setStatus(
    list===mine
      ?"myStatus"
      :"oppStatus",
    "検索中…"
  );

  const results=
    await searchPokemon(query);

  box.innerHTML="";

  if(!results.length){

    setStatus(
      list===mine
        ?"myStatus"
        :"oppStatus",
      "見つかりませんでした"
    );

    return;

  }

  setStatus(
    list===mine
      ?"myStatus"
      :"oppStatus",
    results.length+"件"
  );


  results.forEach(item=>{

    const name=
      item.ja||item.en;

    if(list.includes(name))
      return;

    const button=
      document.createElement("button");

    button.type="button";
    button.className="suggestion";

    button.appendChild(
      safeImage(item.id,name)
    );

    const main=
      document.createElement("div");

    main.className="suggestion-main";

    const title=
      document.createElement("div");

    title.textContent=name;

    main.appendChild(title);

    const sub=
      document.createElement("div");

    sub.className="suggestion-type";

    sub.textContent=
      item.en;

    main.appendChild(sub);

    button.appendChild(main);


    button.addEventListener(
      "click",
      ()=>{

        selectPokemon(
          item,
          list,
          inputId,
          suggestionId
        );

      },
      {passive:true}
    );


    box.appendChild(button);

  });

}


/* =========================================================
   カウント
========================================================= */

function updateCounts(){

  document.getElementById("oppCount")
    .textContent=
    opponent.length+" / 6";

  document.getElementById("myCount")
    .textContent=
    mine.length+" / 6";

}


/* =========================================================
   検索イベント
========================================================= */

function setupSearch(
  inputId,
  suggestionId,
  list
){

  const input=
    document.getElementById(inputId);

  if(!input)
    return;

  input.addEventListener(
    "input",
    ()=>{

      clearTimeout(searchTimer);

      searchTimer=
        setTimeout(
          ()=>renderSearch(
            inputId,
            suggestionId,
            list
          ),
          180
        );

    }
  );

}

"カバルドン":["じめん"],
"ドドゲザン":["あく","はがね"],
"ペンドラー":["むし","どく"],
"エルフーン":["くさ","フェアリー"],
"オーロンゲ":["あく","フェアリー"],
"アーマーガア":["ひこう","はがね"],
"ヘラクロス":["むし","かくとう"],
"ハリーマン":["どく","あく"],
"ヤミラミ":["あく","ゴースト"]

};


/* =========================================================
   タイプをAPIから取得
========================================================= */

const typeCache={};

async function getTypes(item){

  const name=item.ja||item.en;

  if(knownTypes[name])
    return knownTypes[name];

  if(typeCache[item.en])
    return typeCache[item.en];

  try{

    const response=
      await fetch(
        API_BASE+"/pokemon/"+item.en,
        {cache:"force-cache"}
      );

    if(!response.ok)
      return [];

    const data=
      await response.json();

    const types=
      data.types
        .sort((a,b)=>a.slot-b.slot)
        .map(x=>translateType(x.type.name));

    typeCache[item.en]=types;

    return types;

  }catch(e){

    return [];

  }

}


/* =========================================================
   タイプ翻訳
========================================================= */

const typeJP={
normal:"ノーマル",
fire:"ほのお",
water:"みず",
electric:"でんき",
grass:"くさ",
ice:"こおり",
fighting:"かくとう",
poison:"どく",
ground:"じめん",
flying:"ひこう",
psychic:"エスパー",
bug:"むし",
rock:"いわ",
ghost:"ゴースト",
dragon:"ドラゴン",
dark:"あく",
steel:"はがね",
fairy:"フェアリー"
};

function translateType(type){

  return typeJP[type]||type;

}


/* =========================================================
   相性計算
========================================================= */

async function attackScore(attacker,defender){

  const a=
    await getTypes(attacker);

  const d=
    await getTypes(defender);

  if(!a.length || !d.length)
    return 1;

  let best=0;

  a.forEach(atk=>{

    let mult=1;

    d.forEach(def=>{

      if(
        effectiveness[atk] &&
        effectiveness[atk][def]!==undefined
      ){

        mult*=effectiveness[atk][def];

      }

    });

    best=Math.max(best,mult);

  });

  return best||1;

}


async function defensiveScore(attacker,defender){

  const a=
    await getTypes(attacker);

  const d=
    await getTypes(defender);

  if(!a.length || !d.length)
    return 1;

  let best=Infinity;

  a.forEach(atk=>{

    let mult=1;

    d.forEach(def=>{

      if(
        effectiveness[atk] &&
        effectiveness[atk][def]!==undefined
      ){

        mult*=effectiveness[atk][def];

      }

    });

    best=Math.min(best,mult);

  });

  return best===Infinity?1:best;

}


/* =========================================================
   評価
========================================================= */

async function evaluatePokemon(me,enemies){

  let score=0;

  let superEffective=0;
  let immune=0;

  for(const enemy of enemies){

    const off=
      await attackScore(me,enemy);

    const def=
      await defensiveScore(enemy,me);

    if(off>=4){

      score+=8;
      superEffective++;

    }else if(off>=2){

      score+=5;
      superEffective++;

    }else if(off>1){

      score+=3;

    }else if(off===1){

      score+=1;

    }else{

      score-=2;

    }


    if(def===0){

      score+=5;
      immune++;

    }else if(def<1){

      score+=4;

    }else if(def<=.5){

      score+=3;

    }else if(def>=4){

      score-=5;

    }else if(def>=2){

      score-=3;

    }

  }


  const pName=
    me.ja||me.en;

  const mp=
    priorityScore(pName);

  if(mp<20)
    score+=(20-mp)*.15;


  return{
    pokemon:me,
    score,
    superEffective,
    immune
  };

}


/* =========================================================
   組み合わせ
========================================================= */

function combinations(arr){

  const result=[];

  for(let i=0;i<arr.length;i++){

    for(let j=i+1;j<arr.length;j++){

      for(let k=j+1;k<arr.length;k++){

        result.push([
          arr[i],
          arr[j],
          arr[k]
        ]);

      }

    }

  }

  return result;

}


/* =========================================================
   チーム評価
========================================================= */

async function evaluateTeam(team,enemies){

  let score=0;

  for(const p of team){

    const e=
      await evaluatePokemon(
        p,
        enemies
      );

    score+=e.score;

  }


  /* タイプ補完 */

  for(let i=0;i<team.length;i++){

    for(let j=i+1;j<team.length;j++){

      for(const enemy of enemies){

        const a=
          await defensiveScore(
            enemy,
            team[i]
          );

        const b=
          await defensiveScore(
            enemy,
            team[j]
          );

        if(a>=2 && b<=.5)
          score+=3;

        if(b>=2 && a<=.5)
          score+=3;

      }

    }

  }

  return score;

}


/* =========================================================
   選出
========================================================= */

document
.getElementById("judge")
.addEventListener(
"click",
async()=>{

  const result=
    document.getElementById("result");

  result.classList.remove("hidden");

  if(mine.length<6){

    result.innerHTML=`
      <h3>⚠️ 自分の6体が必要です</h3>
      <div class="note">
      自分の6体を登録してください。
      登録内容は変更するまで保存されます。
      </div>
    `;

    return;

  }

  if(opponent.length<6){

    result.innerHTML=`
      <h3>⚠️ 相手の6体が必要です</h3>
      <div class="note">
      相手の6体を登録してください。
      </div>
    `;

    return;

  }


  result.innerHTML=`
    <h3>🔄 計算中…</h3>
    <div class="note">
    タイプ相性を確認しています。
    </div>
  `;


  const enemies=
    opponent.map(name=>
      database.find(
        x=>
          x.ja===name ||
          x.en===name
      )
    ).filter(Boolean);


  const candidates=
    mine.map(name=>
      database.find(
        x=>
          x.ja===name ||
          x.en===name
      )
    ).filter(Boolean);


  if(enemies.length<6 ||
     candidates.length<6){

    result.innerHTML=`
      <h3>⚠️ データを取得できませんでした</h3>
      <div class="warning">
      ポケモン情報の読み込みに失敗しました。
      通信状態を確認してもう一度試してください。
      </div>
    `;

    return;

  }


  const teams=
    combinations(candidates);


  let best=null;


  for(const team of teams){

    const score=
      await evaluateTeam(
        team,
        enemies
      );

    if(
      !best ||
      score>best.score
    ){

      best={
        team,
        score
      };

    }

  }


  const individual=[];


  for(const p of best.team){

    individual.push(
      await evaluatePokemon(
        p,
        enemies
      )
    );

  }


  individual.sort(
    (a,b)=>b.score-a.score
  );


  const names=
    individual.map(
      x=>x.pokemon.ja||x.pokemon.en
    );


  result.innerHTML=`

    <h3>🏆 勝率重視・最適3体</h3>

    <div class="verdict">

      <strong>先発候補：</strong>
      ${names[0]}

      <br>

      <strong>第2候補：</strong>
      ${names[1]}

      <br>

      <strong>第3候補：</strong>
      ${names[2]}

      <br><br>

      <strong>総合スコア：</strong>
      ${best.score.toFixed(1)}

    </div>

    ${individual.map((x,i)=>{

      const p=x.pokemon;

      return`

      <div class="result-item">

        <div class="rank">
          ${i+1}位　
          ${p.ja||p.en}
          <span class="good">
          ${x.score.toFixed(1)}点
          </span>
        </div>

        <div class="note">

          対面有利：
          ${x.superEffective}体

          <br>

          無効・大幅有利：
          ${x.immune}体

        </div>

      </div>

      `;

    }).join("")}

    <div class="note">

      ※この判定はタイプ相性、
      6体の補完関係、環境優先順位を
      基準にした簡易評価です。

    </div>

  `;

});
