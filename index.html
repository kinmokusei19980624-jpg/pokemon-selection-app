function loadTeam(key){
  try{
    const x=JSON.parse(localStorage.getItem(key)||"[]");
    return Array.isArray(x)?x.slice(0,MAX):[];
  }catch(e){return []}
}

function saveTeams(){
  try{
    localStorage.setItem("pokemon_my",JSON.stringify(mine));
    localStorage.setItem("pokemon_opp",JSON.stringify(opponent));
  }catch(e){}
}

function normalize(s){
  return String(s||"")
    .toLowerCase()
    .normalize("NFKC")
    .replace(/[ 　・ー‐-–—\-]/g,"");
}

function imageElement(id,name){
  const img=document.createElement("img");
  img.alt=name||"";
  img.loading="lazy";
  img.decoding="async";
  img.src=ART+id+".png";
  img.onerror=function(){
    if(this.dataset.fallback!=="1"){
      this.dataset.fallback="1";
      this.src=SPRITE+id+".png";
    }
  };
  return img;
}

async function loadDatabase(){
  const myStatus=document.getElementById("myStatus");
  const oppStatus=document.getElementById("oppStatus");

  myStatus.textContent="ポケモン名を読み込み中…";
  oppStatus.textContent="ポケモン名を読み込み中…";

  try{
    const [jaRes,enRes]=await Promise.all([
      fetch(JA_URL,{cache:"force-cache"}),
      fetch(EN_URL,{cache:"force-cache"})
    ]);

    if(!jaRes.ok||!enRes.ok)throw new Error("name data");

    const ja=await jaRes.json();
    const en=await enRes.json();

    if(!Array.isArray(ja)||!Array.isArray(en))throw new Error("invalid");

    const length=Math.min(ja.length,en.length);

    database=[];

    for(let i=0;i<length;i++){
      database.push({
        id:i+1,
        ja:ja[i],
        en:en[i]
      });
    }

    databaseReady=true;

    myStatus.textContent="全"+database.length+"種類から検索できます";
    oppStatus.textContent="全"+database.length+"種類から検索できます";

    renderQuick("my");
    renderQuick("opp");

  }catch(e){
    console.error(e);
    database=[];
    databaseReady=false;

    myStatus.textContent="名前データを取得できませんでした。下の候補は使用できます。";
    oppStatus.textContent="名前データを取得できませんでした。下の候補は使用できます。";

    renderQuick("my");
    renderQuick("opp");
  }
}

function getPokemon(name){
  const n=normalize(name);
  return database.find(p=>normalize(p.ja)===n)
      || database.find(p=>normalize(p.en)===n);
}

function getById(id){
  return database.find(p=>p.id===id);
}

function searchPokemon(q){
  const n=normalize(q);
  if(!n)return [];

  const alias=aliases[n];
  const target=alias?normalize(alias):n;

  let result=database.filter(p=>{
    return normalize(p.ja).includes(target)||
           normalize(p.en).includes(target);
  });

  result.sort((a,b)=>{
    const ai=priority.indexOf(a.ja);
    const bi=priority.indexOf(b.ja);
    const av=ai<0?9999:ai;
    const bv=bi<0?9999:bi;
    if(av!==bv)return av-bv;

    const ae=normalize(a.ja)===target?0:1;
    const be=normalize(b.ja)===target?0:1;
    return ae-be;
  });

  return result.slice(0,24);
}

function renderQuick(kind){
  const box=document.getElementById(kind==="my"?"myResults":"oppResults");
  box.innerHTML="";

  const list=[];

  priority.forEach(name=>{
    const p=getPokemon(name);
    if(p&&!list.some(x=>x.id===p.id))list.push(p);
  });

  list.slice(0,12).forEach(p=>{
    addCard(box,p,kind);
  });
}

function addCard(box,p,kind){
  const selected=(kind==="my"?mine:opponent).includes(p.ja);

  const card=document.createElement("div");
  card.className="card"+(selected?" selected":"");

  card.appendChild(imageElement(p.id,p.ja));

  const b=document.createElement("b");
  b.textContent=p.ja;
  card.appendChild(b);

  const small=document.createElement("small");
  small.textContent="#"+String(p.id).padStart(4,"0")+" "+p.en;
  card.appendChild(small);

  card.onclick=()=>selectPokemon(p,kind);

  box.appendChild(card);
}

function renderSearchResults(kind,list){
  const box=document.getElementById(kind==="my"?"myResults":"oppResults");
  box.innerHTML="";

  if(!list.length){
    const empty=document.createElement("div");
    empty.className="note";
    empty.textContent="該当するポケモンがありません。";
    box.appendChild(empty);
    return;
  }

  list.forEach(p=>addCard(box,p,kind));
}

function selectPokemon(p,kind){
  const arr=kind==="my"?mine:opponent;

  if(arr.includes(p.ja))return;

  if(arr.length>=MAX){
    alert("6体まで選択できます。");
    return;
  }

  arr.push(p.ja);
  saveTeams();

  const input=document.getElementById(kind==="my"?"mySearch":"oppSearch");
  input.value="";

  renderSelected();
  renderQuick(kind);

  document.getElementById(kind==="my"?"myStatus":"oppStatus").textContent=
    "選択済み："+arr.length+" / 6";
}

function removePokemon(kind,index){
  const arr=kind==="my"?mine:opponent;
  arr.splice(index,1);
  saveTeams();
  renderSelected();
  renderQuick(kind);
}

function renderSelected(){
  const sets=[
    ["my",mine,"mySelected"],
    ["opp",opponent,"oppSelected"]
  ];

  sets.forEach(([kind,arr,id])=>{
    const box=document.getElementById(id);
    box.innerHTML="";

    for(let i=0;i<6;i++){
      const slot=document.createElement("div");
      slot.className="slot";

      if(arr[i]){
        const p=getPokemon(arr[i]);

        if(p)slot.appendChild(imageElement(p.id,p.ja));

        const name=document.createElement("div");
        name.className="slot-name";
        name.textContent=arr[i];
        slot.appendChild(name);

        const remove=document.createElement("button");
        remove.className="slot-remove";
        remove.textContent="解除";
        remove.onclick=()=>removePokemon(kind,i);
        slot.appendChild(remove);
      }else{
        slot.textContent="空き";
      }

      box.appendChild(slot);
    }

    document.getElementById(kind==="my"?"myCount":"oppCount").textContent=
      arr.length+" / 6";
  });
}

function setupSearch(kind){
  const input=document.getElementById(kind==="my"?"mySearch":"oppSearch");

  input.addEventListener("input",()=>{
    clearTimeout(searchTimer);

    searchTimer=setTimeout(()=>{
      const q=input.value.trim();

      if(!q){
        renderQuick(kind);
        document.getElementById(kind==="my"?"myStatus":"oppStatus").textContent=
          databaseReady?"全"+database.length+"種類から検索できます":"候補を表示中";
        return;
      }

      if(!databaseReady){
        document.getElementById(kind==="my"?"myStatus":"oppStatus").textContent=
          "名前データを取得できないため検索できません。再読み込みしてください。";
        return;
      }

      const result=searchPokemon(q);

      renderSearchResults(kind,result);

      document.getElementById(kind==="my"?"myStatus":"oppStatus").textContent=
        result.length+"件";
    },100);
  });
}

async function getBattleInfo(p){
  if(!p)return null;

  if(infoCache.has(p.id))return infoCache.get(p.id);

  try{
    const res=await fetch(API+p.id,{cache:"force-cache"});
    if(!res.ok)throw new Error();

    const data=await res.json();

    const info={
      id:p.id,
      ja:p.ja,
      en:p.en,
      types:data.types.map(x=>typeJP[x.type.name]||x.type.name),
      stats:{
        hp:data.stats[0]?.base_stat||0,
        attack:data.stats[1]?.base_stat||0,
        defense:data.stats[2]?.base_stat||0,
        spAttack:data.stats[3]?.base_stat||0,
        spDefense:data.stats[4]?.base_stat||0,
        speed:data.stats[5]?.base_stat||0
      }
    };

    infoCache.set(p.id,info);
    return info;

  }catch(e){
    const info={
      id:p.id,
      ja:p.ja,
      en:p.en,
      types:[],
      stats:{hp:0,attack:0,defense:0,spAttack:0,spDefense:0,speed:0}
    };

    infoCache.set(p.id,info);
    return info;
  }
}

function multiplier(attackType,defTypes){
  let m=1;

  const row=chart[attackType]||{};

  defTypes.forEach(t=>{
    if(row[t]!==undefined)m*=row[t];
  });

  return m;
}

function offensiveScore(a,d){
  if(!a||!d||!a.types?.length||!d.types?.length)return 0;

  let best=1;

  a.types.forEach(type=>{
    best=Math.max(best,multiplier(type,d.types));
  });

  if(best===0)return -3;
  if(best>=4)return 8;
  if(best>=2)return 5;
  if(best<1)return -2;
  return 1;
}

function defensiveScore(a,d){
  if(!a||!d||!a.types?.length||!d.types?.length)return 0;

  let total=0;

  d.types.forEach(type=>{
    const m=multiplier(type,a.types);

    if(m===0)total+=4;
    else if(m<=.25)total+=5;
    else if(m<=.5)total+=3;
    else if(m>=4)total-=6;
    else if(m>=2)total-=3;
  });

  return total;
}

function individualScore(p,enemies){
  let score=0;

  enemies.forEach(e=>{
    score+=offensiveScore(p,e);
    score+=defensiveScore(p,e)*0.8;
  });

  const stats=p.stats||{};

  score+=Math.max(stats.attack,stats.spAttack)/40;
  score+=stats.speed/50;

  const usage=usageData[p.ja];

  if(usage){
    score+=(25-usage.rank)*0.18;
  }

  return score;
}

function teamScore(team,enemies){
  let score=0;

  team.forEach(p=>{
    score+=individualScore(p,enemies);
  });

  const types=new Set();

  team.forEach(p=>{
    p.types.forEach(t=>types.add(t));
  });

  score+=types.size*1.1;

  for(let i=0;i<team.length;i++){
    for(let j=i+1;j<team.length;j++){
      const a=team[i];
      const b=team[j];

      a.types.forEach(t=>{
        const pressure=multiplier(t,b.types);
        if(pressure>=2)score+=.5;
      });
    }
  }

  return score;
}

function combinations(arr){
  const out=[];

  for(let i=0;i<arr.length;i++){
    for(let j=i+1;j<arr.length;j++){
      for(let k=j+1;k<arr.length;k++){
        out.push([arr[i],arr[j],arr[k]]);
      }
    }
  }

  return out;
}

async function judge(){
  const result=document.getElementById("result");
  result.classList.remove("hidden");

  if(mine.length!==6){
    result.innerHTML="<h3>⚠️ 自分の6体をすべて選択してください</h3>";
    return;
  }

  if(opponent.length!==6){
    result.innerHTML="<h3>⚠️ 相手の6体をすべて選択してください</h3>";
    return;
  }

  result.innerHTML=
    "<h3>🔄 選出を計算中…</h3><div class='note'>必要な12体だけを取得して計算しています。iPhoneへの負荷を抑えています。</div>";

  const own=mine.map(getPokemon).filter(Boolean);
  const enemies=opponent.map(getPokemon).filter(Boolean);

  const all=[...own,...enemies];

  for(let i=0;i<all.length;i++){
    await getBattleInfo(all[i]);
    if(i%3===2)await new Promise(r=>setTimeout(r,0));
  }

  const ownInfo=own.map(p=>infoCache.get(p.id));
  const enemyInfo=enemies.map(p=>infoCache.get(p.id));

  const teams=combinations(ownInfo);

  let best=null;

  for(let i=0;i<teams.length;i++){
    const score=teamScore(teams[i],enemyInfo);

    if(!best||score>best.score){
      best={team:teams[i],score};
    }

    if(i%10===0)await new Promise(r=>setTimeout(r,0));
  }

  const ranked=best.team
    .map(p=>({
      p,
      score:individualScore(p,enemyInfo)
    }))
    .sort((a,b)=>b.score-a.score);

  const names=ranked.map(x=>x.p.ja).join(" → ");

  let html=
    "<h3>🏆 勝率重視・推奨3体</h3>"+
    "<div class='verdict'><strong>"+names+"</strong><br>"+
    "総合スコア："+best.score.toFixed(1)+
    "</div>";

  ranked.forEach((x,i)=>{
    const p=x.p;
    const u=usageData[p.ja];

    html+=
      "<div class='result-item'>"+
      "<strong>"+(i+1)+"位　"+p.ja+"</strong>"+
      "<div class='note'>"+
      "タイプ："+(p.types.join(" / ")||"取得不可")+
      "<br>評価："+x.score.toFixed(1)+"点"+
      "</div>";

    if(u){
      html+=
        "<div class='build'>"+
        "<div class='build-title'>📊 使用率・環境データ</div>"+
        "使用率順位："+u.rank+"位　("+u.rate+"%)"+
        "<br>技："+u.moves+
        "<br>持ち物："+u.item+
        "<br>特性："+u.ability+
        "<br>性格："+u.nature+
        "</div>";
    }

    html+="</div>";
  });

  html+=
    "<div class='note'>"+
    "タイプ相性・攻撃範囲・耐性・種族値・環境使用率・3体の補完を総合評価。"+
    "<br>実際の対戦では技構成・持ち物・メガシンカ等によって最適解が変わる場合があります。"+
    "</div>";

  result.innerHTML=html;
}

document.getElementById("oppClear").onclick=()=>{

  renderSelected();
  renderQuick("opp");
};

document.getElementById("judge").onclick=judge;

setupSearch("my");
setupSearch("opp");

renderSelected();
renderQuick("my");
renderQuick("opp");

loadDatabase();

</script>
